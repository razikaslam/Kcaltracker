<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KcalTrack</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#091321">
<meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #091321;
  --card: #132136;
  --card-alt: rgba(255,255,255,0.05);
  --blue: #1A8CFF;
  --green: #1AE6A6;
  --orange: #FF9E26;
  --purple: #9461FF;
  --red: #FF5C5C;
  --text: #F0F2F5;
  --text-sec: #7A8BA3;
  --border: rgba(255,255,255,0.06);
  --ring-track: rgba(255,255,255,0.08);
  --radius: 18px;
  --radius-sm: 12px;
  --tab-h: 56px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html {
  width: 100%;
  min-height: 100%;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

@media (max-width: 430px) {
  html, body {
    width: 100%;
    max-width: 100%;
  }

  input, select, button, textarea {
    -webkit-appearance: none;
  }

  /* Keep iOS Safari from zooming the page when a form field is focused. */
  input, select, textarea {
    font-size: 16px !important;
  }

  .form-input {
    width: 130px;
  }

  .view-title {
    font-size: 26px;
  }

  .card {
    padding: 15px;
  }

  .cal-ring-wrap {
    width: 180px;
    height: 180px;
  }

  .cal-ring-wrap svg {
    width: 180px;
    height: 180px;
  }

  .cal-ring-value {
    font-size: 32px;
  }

  .tab-btn {
    padding-left: 8px;
    padding-right: 8px;
  }
}

body {
  font-family: 'Plus Jakarta Sans', -apple-system, system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  overflow: hidden;
  height: 100dvh;
  position: fixed;
  width: 100%;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 430px;
  margin: 0 auto;
}

#content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain;
  padding-bottom: calc(var(--tab-h) + var(--safe-b) + 8px);
}

#content::-webkit-scrollbar { display: none; }

/* ── Tab Bar ── */
#tabbar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 430px;
  display: flex;
  align-items: center;
  justify-content: space-around;
  height: calc(var(--tab-h) + var(--safe-b));
  padding-bottom: var(--safe-b);
  background: rgba(9,19,33,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  z-index: 50;
}

.tab-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  background: none;
  border: none;
  color: var(--text-sec);
  font: 500 10px/1 'Plus Jakarta Sans', sans-serif;
  padding: 6px 12px;
  cursor: pointer;
  transition: color 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.tab-btn.active { color: var(--blue); }
.tab-btn svg { width: 22px; height: 22px; }

/* ── Header ── */
.view-header {
  padding: 12px 20px 8px;
  padding-top: calc(12px + var(--safe-t));
}
.view-title { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
.view-subtitle { font-size: 14px; color: var(--text-sec); margin-top: 2px; }

/* ── Cards ── */
.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px;
}
.cards { display: flex; flex-direction: column; gap: 14px; padding: 0 16px 20px; }

/* ── Stat boxes ── */
.stat-row { display: flex; gap: 10px; }
.stat-box {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px;
  background: var(--card-alt);
  border-radius: var(--radius-sm);
}
.stat-icon { font-size: 18px; flex-shrink: 0; }
.stat-val { font-weight: 700; font-size: 15px; }
.stat-label { font-size: 11px; color: var(--text-sec); }

/* ── Macro rings row ── */
.rings-row {
  display: flex;
  justify-content: space-around;
  padding: 4px 0;
}
.ring-wrap { text-align: center; }

.macro-row {
  display: flex;
  justify-content: space-around;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.macro-cell { text-align: center; flex: 1; }
.macro-val { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.macro-label { font-size: 10px; color: var(--text-sec); margin-top: 2px; }

/* ── Weight card ── */
.weight-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.weight-diff { font-weight: 700; font-size: 15px; }

/* ── List items ── */
.list-section { padding: 0 16px; }
.list-section-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-sec);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 16px 0 8px;
}
.list-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  background: var(--card);
  border-radius: var(--radius-sm);
  margin-bottom: 6px;
}
.list-item-info { flex: 1; min-width: 0; }
.list-item-name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-item-meta { font-size: 12px; color: var(--text-sec); margin-top: 2px; }
.list-item-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; margin-left: 12px; }
.list-item-val { font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }

.del-btn {
  background: none; border: none; color: var(--red); cursor: pointer;
  padding: 6px; font-size: 16px; opacity: 0.7;
}
.del-btn:active { opacity: 1; }

/* ── Summary bar ── */
.summary-bar {
  display: flex;
  padding: 12px 16px;
  background: var(--card);
  border-radius: var(--radius-sm);
  margin: 0 16px 8px;
}
.summary-cell { flex: 1; text-align: center; }
.summary-val { font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
.summary-label { font-size: 10px; color: var(--text-sec); margin-top: 2px; }

/* ── Segment picker ── */
.seg-picker {
  display: flex;
  background: var(--card-alt);
  border-radius: 10px;
  padding: 3px;
  margin: 8px 16px 12px;
}
.seg-btn {
  flex: 1;
  padding: 8px;
  border: none;
  background: none;
  color: var(--text-sec);
  font: 600 13px/1 'Plus Jakarta Sans', sans-serif;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
}
.seg-btn.active {
  background: var(--card);
  color: var(--text);
}

/* ── Progress bars ── */
.progress-item { margin-bottom: 14px; }
.progress-header { display: flex; justify-content: space-between; margin-bottom: 6px; }
.progress-title { font-weight: 600; font-size: 14px; }
.progress-vals { font-size: 12px; color: var(--text-sec); font-variant-numeric: tabular-nums; }
.progress-track {
  height: 8px;
  background: var(--ring-track);
  border-radius: 4px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.5s ease;
}

/* ── Summary cards in progress ── */
.summary-card-row { display: flex; gap: 12px; }
.summary-card-item { flex: 1; }
.summary-card-label { font-size: 12px; color: var(--text-sec); }
.summary-card-val { font-size: 22px; font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; }
.summary-card-unit { font-size: 12px; color: var(--text-sec); margin-top: 1px; }

/* ── Forms ── */
.form-group {
  padding: 0 20px;
}
.form-section-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-sec);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 20px 0 8px;
}
.form-field {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  background: var(--card);
  border-radius: var(--radius-sm);
  margin-bottom: 6px;
}
.form-label { font-size: 15px; font-weight: 500; flex-shrink: 0; }
.form-input {
  background: none;
  border: none;
  color: var(--text);
  font: 500 15px 'Plus Jakarta Sans', sans-serif;
  text-align: right;
  width: 120px;
  outline: none;
  font-variant-numeric: tabular-nums;
}
.form-input::placeholder { color: var(--text-sec); }

.form-input-full {
  width: 100%;
  padding: 14px 16px;
  background: var(--card);
  border-radius: var(--radius-sm);
  border: none;
  color: var(--text);
  font: 500 15px 'Plus Jakarta Sans', sans-serif;
  outline: none;
  margin-bottom: 6px;
}
.form-input-full::placeholder { color: var(--text-sec); }

.form-select {
  background: none;
  border: none;
  color: var(--blue);
  font: 500 15px 'Plus Jakarta Sans', sans-serif;
  text-align: right;
  cursor: pointer;
  outline: none;
  -webkit-appearance: none;
  padding-right: 4px;
}
.form-select option { background: var(--card); color: var(--text); }

/* ── Stepper ── */
.stepper {
  display: flex;
  align-items: center;
  gap: 12px;
}
.stepper-btn {
  width: 32px; height: 32px;
  border-radius: 50%;
  border: none;
  background: var(--card-alt);
  color: var(--blue);
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.stepper-btn:active { background: var(--blue); color: var(--text); }
.stepper-val { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 28px; text-align: center; }

/* ── Modal ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
.modal-overlay.active { opacity: 1; pointer-events: auto; }

.modal-sheet {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%) translateY(100%);
  width: 100%;
  max-width: 430px;
  background: var(--bg);
  border-radius: 24px 24px 0 0;
  max-height: 90dvh;
  overflow-y: auto;
  transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
  z-index: 101;
  padding-bottom: calc(20px + var(--safe-b));
}
.modal-overlay.active .modal-sheet { transform: translateX(-50%) translateY(0); }

.modal-handle {
  width: 36px;
  height: 5px;
  background: rgba(255,255,255,0.2);
  border-radius: 3px;
  margin: 10px auto 0;
}
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
}
.modal-title { font-size: 18px; font-weight: 700; }
.modal-btn {
  background: none;
  border: none;
  font: 600 15px 'Plus Jakarta Sans', sans-serif;
  cursor: pointer;
  padding: 6px 2px;
}
.modal-cancel { color: var(--text-sec); }
.modal-save { color: var(--blue); }
.modal-save:disabled { color: var(--text-sec); opacity: 0.5; }

/* ── Pill picker (meal selector) ── */
.pill-row { display: flex; gap: 8px; padding: 0 20px 8px; overflow-x: auto; }
.pill-btn {
  padding: 8px 16px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: none;
  color: var(--text-sec);
  font: 500 13px 'Plus Jakarta Sans', sans-serif;
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.2s;
}
.pill-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; }

/* ── Empty state ── */
.empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-sec);
}
.empty-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.4; }
.empty-text { font-size: 14px; }

/* ── FAB ── */
.fab {
  position: fixed;
  bottom: calc(var(--tab-h) + var(--safe-b) + 16px);
  right: max(16px, calc((100% - 430px)/2 + 16px));
  width: 52px;
  height: 52px;
  border-radius: 50%;
  border: none;
  background: var(--blue);
  color: #fff;
  font-size: 28px;
  font-weight: 300;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(26,140,255,0.35);
  z-index: 40;
  transition: transform 0.15s;
}
.fab:active { transform: scale(0.92); }

/* ── Animations ── */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.animate-in { animation: fadeIn 0.3s ease both; }

/* ── Calorie ring center ── */
.cal-ring-center {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}
.cal-ring-value { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; }
.cal-ring-target { font-size: 13px; color: var(--text-sec); }
.cal-ring-left { font-size: 12px; color: var(--green); font-weight: 600; margin-top: 2px; }

.cal-ring-wrap {
  position: relative;
  width: 190px;
  height: 190px;
  margin: 4px auto 12px;
}

/* ── Date navigator ── */
.date-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 16px 12px;
}
.date-nav-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: none;
  background: var(--card);
  color: var(--text);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.date-nav-btn:active { background: var(--blue); }
.date-nav-btn:disabled { opacity: 0.25; pointer-events: none; }
.date-nav-center { text-align: center; cursor: pointer; position: relative; }
.date-nav-label { font-weight: 700; font-size: 16px; }
.date-nav-sub { font-size: 11px; color: var(--text-sec); margin-top: 1px; }
.date-nav-input {
  position: absolute;
  inset: 0;
  opacity: 0;
  width: 100%;
  height: 100%;
  cursor: pointer;
  font-size: 16px;
  -webkit-appearance: none;
}

/* ── Date field in modal ── */
.date-field {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  background: var(--card);
  border-radius: var(--radius-sm);
  margin: 0 20px 8px;
}
.date-field-label { font-size: 15px; font-weight: 500; }
.date-field-input {
  background: none;
  border: none;
  color: var(--blue);
  font: 500 15px 'Plus Jakarta Sans', sans-serif;
  outline: none;
  -webkit-appearance: none;
  text-align: right;
}

/* ── Workout icon ── */
.wo-icon {
  width: 40px; height: 40px;
  border-radius: 10px;
  background: rgba(255,158,38,0.12);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  color: var(--orange);
  flex-shrink: 0;
  margin-right: 12px;
}
</style>

<div id="app">
  <main id="content"></main>
  <nav id="tabbar"></nav>
</div>
<div id="modal-overlay" class="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div id="modal-sheet" class="modal-sheet"></div>
</div>

<script>
const TABS = [
  { id:'home', label:'Home', icon:`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 11.5l8-7 8 7V20a1 1 0 01-1 1h-4.5v-5.5a1 1 0 00-1-1h-3a1 1 0 00-1 1V21H5a1 1 0 01-1-1z"/></svg>` },
  { id:'food', label:'Food', icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 3v7a3 3 0 003 3m0 0v8m0-11a3 3 0 003-3V3m-3 0v10M18 3c0 3-.8 6-.8 8s.8 2.5.8 2.5V21"/></svg>` },
  { id:'workout', label:'Workout', icon:`<svg viewBox="0 0 24 24" fill="currentColor"><rect x="1" y="9" width="2.5" height="6" rx="1"/><rect x="4.5" y="6.5" width="3" height="11" rx="1"/><rect x="16.5" y="6.5" width="3" height="11" rx="1"/><rect x="20.5" y="9" width="2.5" height="6" rx="1"/><rect x="7.5" y="10.5" width="9" height="3" rx=".5"/></svg>` },
  { id:'progress', label:'Progress', icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20l5.5-7 4 4.5L22 6"/></svg>` },
  { id:'profile', label:'More', icon:`<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/></svg>` }
];

const MEALS = ['Breakfast','Lunch','Dinner','Snack'];
const WO_TYPES = ['Weight Training','Running','Cycling','Walking','HIIT','Swimming','Yoga','Sports','Other'];

// ── Data Store ──
const store = {
  foods: [],
  workouts: [],
  weights: [],
  profile: {
    name:'', age:25, height:170, currentWeight:70, goalWeight:65,
    sex:'Male', activity:'Moderately Active',
    calorieTarget:2000, proteinTarget:125, carbTarget:230,
    fatTarget:80, fiberTarget:30
  },

  get todayFoods() { return this.foods.filter(f => isToday(f.date)); },
  get todayWorkouts() { return this.workouts.filter(w => isToday(w.date)); },
  get todayKcal() { return this.todayFoods.reduce((s,f) => s+f.kcal, 0); },
  get todayProtein() { return this.todayFoods.reduce((s,f) => s+f.protein, 0); },
  get todayCarbs() { return this.todayFoods.reduce((s,f) => s+f.carbs, 0); },
  get todayFat() { return this.todayFoods.reduce((s,f) => s+f.fat, 0); },
  get todayFiber() { return this.todayFoods.reduce((s,f) => s+f.fiber, 0); },
  get todayBurn() { return this.todayWorkouts.reduce((s,w) => s+w.kcal, 0); },
  get netKcal() { return this.todayKcal - this.todayBurn; },

  foodsForLast(days) {
    const start = new Date(); start.setHours(0,0,0,0);
    start.setDate(start.getDate() - (days - 1));
    return this.foods.filter(f => new Date(f.date) >= start);
  },
  workoutsForLast(days) {
    const start = new Date(); start.setHours(0,0,0,0);
    start.setDate(start.getDate() - (days - 1));
    return this.workouts.filter(w => new Date(w.date) >= start);
  },

  addFood(entry, date) { entry.id = uid(); entry.date = (date || new Date()).toISOString(); this.foods.unshift(entry); this.save(); },
  deleteFood(id) { this.foods = this.foods.filter(f => f.id !== id); this.save(); },
  addWorkout(entry) { entry.id = uid(); entry.date = new Date().toISOString(); this.workouts.unshift(entry); this.save(); },
  deleteWorkout(id) { this.workouts = this.workouts.filter(w => w.id !== id); this.save(); },
  addWeight(val) {
    this.weights.unshift({ id: uid(), date: new Date().toISOString(), weight: val });
    this.profile.currentWeight = val;
    this.save();
  },

  save() {
    try {
      localStorage.setItem('kt_foods', JSON.stringify(this.foods));
      localStorage.setItem('kt_workouts', JSON.stringify(this.workouts));
      localStorage.setItem('kt_weights', JSON.stringify(this.weights));
      localStorage.setItem('kt_profile', JSON.stringify(this.profile));
    } catch(e) {}
  },
  load() {
    try {
      const f = localStorage.getItem('kt_foods');
      const w = localStorage.getItem('kt_workouts');
      const wt = localStorage.getItem('kt_weights');
      const p = localStorage.getItem('kt_profile');
      if (f) this.foods = JSON.parse(f);
      if (w) this.workouts = JSON.parse(w);
      if (wt) this.weights = JSON.parse(wt);
      if (p) Object.assign(this.profile, JSON.parse(p));
    } catch(e) {}
  }
};

// ── Helpers ──
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function isToday(d) { const t = new Date(), dd = new Date(d); return t.toDateString() === dd.toDateString(); }
function clamp(v, lo, hi) { return Math.min(Math.max(v, lo), hi); }
function r(v) { return Math.round(v); }

function greeting() {
  const h = new Date().getHours();
  const t = h < 12 ? 'Morning' : h < 17 ? 'Afternoon' : 'Evening';
  const e = h < 12 ? '☀️' : h < 17 ? '🌤️' : '🌙';
  const n = store.profile.name || 'there';
  return `Good ${t}, ${n} ${e}`;
}

function ringSVG(value, total, color, size, label) {
  const sw = size > 100 ? 14 : 6;
  const rad = (size - sw) / 2;
  const circ = 2 * Math.PI * rad;
  const p = clamp(total > 0 ? value / total : 0, 0, 1);
  const off = circ * (1 - p);
  const cx = size/2, cy = size/2;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${cx}" cy="${cy}" r="${rad}" fill="none" stroke="var(--ring-track)" stroke-width="${sw}"/>
    <circle cx="${cx}" cy="${cy}" r="${rad}" fill="none" stroke="${color}" stroke-width="${sw}"
      stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${off}"
      transform="rotate(-90 ${cx} ${cy})" style="transition:stroke-dashoffset .6s ease"/>
    ${label ? `<text x="${cx}" y="${cy-5}" text-anchor="middle" fill="var(--text)" font-size="14" font-weight="700" font-family="Plus Jakarta Sans,sans-serif">${r(value)}</text>
    <text x="${cx}" y="${cy+10}" text-anchor="middle" fill="var(--text-sec)" font-size="9" font-family="Plus Jakarta Sans,sans-serif">${label}</text>
    <text x="${cx}" y="${cy+24}" text-anchor="middle" fill="${color}" font-size="9" font-weight="700" font-family="Plus Jakarta Sans,sans-serif">${r(p*100)}%</text>` : ''}
  </svg>`;
}

function calRingSVG() {
  const val = store.todayKcal, tot = store.profile.calorieTarget;
  const size = 190, sw = 14, rad = (size-sw)/2;
  const circ = 2 * Math.PI * rad;
  const p = clamp(tot > 0 ? val / tot : 0, 0, 1);
  const off = circ * (1 - p);
  const cx = size/2;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="var(--blue)"/><stop offset="1" stop-color="var(--green)"/></linearGradient></defs>
    <circle cx="${cx}" cy="${cx}" r="${rad}" fill="none" stroke="var(--ring-track)" stroke-width="${sw}"/>
    <circle cx="${cx}" cy="${cx}" r="${rad}" fill="none" stroke="url(#cg)" stroke-width="${sw}"
      stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${off}"
      transform="rotate(-90 ${cx} ${cx})" style="transition:stroke-dashoffset .6s ease"/>
  </svg>`;
}

function woIcon(type) {
  const t = type.toLowerCase();
  if (t.includes('run') || t.includes('walk')) return '🏃';
  if (t.includes('cycl')) return '🚴';
  if (t.includes('swim')) return '🏊';
  if (t.includes('yoga')) return '🧘';
  if (t.includes('hiit')) return '⚡';
  if (t.includes('sport')) return '⚽';
  return '🏋️';
}

function isSameDay(d1, d2) { return new Date(d1).toDateString() === new Date(d2).toDateString(); }

function foodsForDate(date) { return store.foods.filter(f => isSameDay(f.date, date)); }
function kcalForDate(date) { return foodsForDate(date).reduce((s,f) => s+f.kcal, 0); }
function proteinForDate(date) { return foodsForDate(date).reduce((s,f) => s+f.protein, 0); }
function carbsForDate(date) { return foodsForDate(date).reduce((s,f) => s+f.carbs, 0); }
function fatForDate(date) { return foodsForDate(date).reduce((s,f) => s+f.fat, 0); }

function toDateStr(d) { const dd = new Date(d); return `${dd.getFullYear()}-${String(dd.getMonth()+1).padStart(2,'0')}-${String(dd.getDate()).padStart(2,'0')}`; }
function toDisplayDate(d) {
  const dd = new Date(d);
  const today = new Date(); today.setHours(0,0,0,0);
  const yesterday = new Date(today); yesterday.setDate(yesterday.getDate()-1);
  if (dd.toDateString() === today.toDateString()) return 'Today';
  if (dd.toDateString() === yesterday.toDateString()) return 'Yesterday';
  return dd.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
}
function toFullDate(d) {
  return new Date(d).toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric', year:'numeric' });
}
function shiftDate(d, days) {
  const dd = new Date(d);
  dd.setDate(dd.getDate() + days);
  return dd;
}

  $tabbar.innerHTML = TABS.map((t,i) =>
    `<button class="tab-btn${i===currentTab?' active':''}" data-tab="${i}">${t.icon}<span>${t.label}</span></button>`
  ).join('');
}

function switchTab(i) {
  if (i === currentTab && $content.scrollTop === 0) return;
  currentTab = i;
  renderTabBar();
  renderView();
  $content.scrollTop = 0;
}

function renderView() {
  const fab = document.querySelector('.fab');
  if (fab) fab.remove();

  switch(currentTab) {
    case 0: renderHome(); break;
    case 1: renderFood(); break;
    case 2: renderWorkout(); break;
    case 3: renderProgress(); break;
    case 4: renderProfile(); break;
  }
}

  const dateVal = toDateStr(forDate || new Date());
  openModal(`
    <div class="modal-header">
      <button class="modal-btn modal-cancel" onclick="closeModal()">Cancel</button>
      <span class="modal-title">Add Food</span>

      <input type="date" class="date-field-input" id="af-date" value="${dateVal}">
    </div>
    <div class="pill-row">
      ${MEALS.map(m => `<button class="pill-btn${m===meal?' active':''}" data-meal="${m}">${m}</button>`).join('')}
    </div>
    <div class="form-group">
      <input class="form-input-full" id="af-name" placeholder="Food name" autocomplete="off">
      <input class="form-input-full" id="af-kcal" type="number" inputmode="decimal" placeholder="Calories (kcal)">
      <div class="form-section-title">Macros</div>
      <input class="form-input-full" id="af-protein" type="number" inputmode="decimal" placeholder="Protein (g)">
      <input class="form-input-full" id="af-carbs" type="number" inputmode="decimal" placeholder="Carbs (g)">
      <input class="form-input-full" id="af-fat" type="number" inputmode="decimal" placeholder="Fat (g)">
      <input class="form-input-full" id="af-fiber" type="number" inputmode="decimal" placeholder="Fiber (g)">
    </div>
  `);

  $sheet.querySelectorAll('[data-meal]').forEach(btn => {
    btn.onclick = () => {
      meal = btn.dataset.meal;
      $sheet.querySelectorAll('[data-meal]').forEach(b => b.classList.toggle('active', b.dataset.meal === meal));
    };
  });

  document.getElementById('save-food').onclick = () => {
    const name = document.getElementById('af-name').value.trim();
    if (!name) return;
    const pickedDate = new Date(document.getElementById('af-date').value + 'T12:00:00');
    store.addFood({
      meal,
      name,
      kcal: parseFloat(document.getElementById('af-kcal').value) || 0,
      protein: parseFloat(document.getElementById('af-protein').value) || 0,
      carbs: parseFloat(document.getElementById('af-carbs').value) || 0,
      fat: parseFloat(document.getElementById('af-fat').value) || 0,
      fiber: parseFloat(document.getElementById('af-fiber').value) || 0

    foodViewDate = new Date(pickedDate);
    foodViewDate.setHours(0,0,0,0);
    closeModal();
    renderView();
  };
  document.getElementById('af-name').focus();

    </div>
    <div class="form-group">
      <div class="form-field">
        <span class="form-label">Workout</span>
        <select class="form-select" id="aw-type">
          ${WO_TYPES.map(t => `<option>${t}</option>`).join('')}
        </select>
      </div>
      <input class="form-input-full" id="aw-min" type="number" inputmode="numeric" placeholder="Duration (minutes)">
      <input class="form-input-full" id="aw-kcal" type="number" inputmode="decimal" placeholder="Calories burned">
    </div>
  `);

  document.getElementById('save-wo').onclick = () => {
    store.addWorkout({
      type: document.getElementById('aw-type').value,
      minutes: parseInt(document.getElementById('aw-min').value) || 0,
      kcal: parseFloat(document.getElementById('aw-kcal').value) || 0
    });
    closeModal();
    renderView();
  };
}

function showAddWeight() {
  openModal(`
    <div class="modal-header">
      <button class="modal-btn modal-cancel" onclick="closeModal()">Cancel</button>
      <span class="modal-title">Add Weight</span>
      <button class="modal-btn modal-save" id="save-wt">Add</button>
    </div>
    <div class="form-group">
      <input class="form-input-full" id="awv" type="number" inputmode="decimal" placeholder="Weight (kg)" autofocus>
    </div>
  `);

  document.getElementById('save-wt').onclick = () => {
    const v = parseFloat(document.getElementById('awv').value);
    if (v > 0) { store.addWeight(v); closeModal(); renderView(); }
  };
}

// ── Escape HTML ──
function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

// ── Event Delegation ──
document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab) { switchTab(parseInt(tab.dataset.tab)); return; }

  const delFood = e.target.closest('[data-del-food]');
  if (delFood) { store.deleteFood(delFood.dataset.delFood); renderView(); return; }

  const delWo = e.target.closest('[data-del-wo]');
  if (delWo) { store.deleteWorkout(delWo.dataset.delWo); renderView(); return; }

  const seg = e.target.closest('[data-period]');
  if (seg) { progressPeriod = parseInt(seg.dataset.period); renderView(); return; }

  const dateShift = e.target.closest('[data-date-shift]');
  if (dateShift) {
    const delta = parseInt(dateShift.dataset.dateShift);
    foodViewDate = shiftDate(foodViewDate, delta);
    renderView();
    return;
  }

  const step = e.target.closest('[data-step]');
  if (step) {
    const [field, delta] = step.dataset.step.split(',');
    store.profile[field] = clamp(store.profile[field] + parseInt(delta), 1, 120);
    store.save();
    renderProfile();
    return;
  }
});

document.addEventListener('input', e => {
  const prof = e.target.dataset?.profile;
  if (prof) {
    if (e.target.dataset.type === 'num') {
      store.profile[prof] = parseFloat(e.target.value) || 0;
    } else {
      store.profile[prof] = e.target.value;
    }
    store.save();
  }
});

document.addEventListener('change', e => {
  const prof = e.target.dataset?.profile;
  if (prof) {
    store.profile[prof] = e.target.value;
    store.save();
  }
  const datePick = e.target.dataset?.datePick;
  if (datePick === 'food' && e.target.value) {
    foodViewDate = new Date(e.target.value + 'T00:00:00');
    renderView();
  }
});

// ── PWA Manifest (inline) ──
function setupPWA() {
  const manifest = {
    name: 'KcalTrack',
    short_name: 'KcalTrack',
    display: 'standalone',
    background_color: '#091321',
    theme_color: '#091321',
    start_url: '.',
    scope: '.'
  };
  const blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = URL.createObjectURL(blob);
  document.head.appendChild(link);

  // Generate app icon
  try {
    const c = document.createElement('canvas');
    c.width = c.height = 180;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#091321';
    ctx.beginPath();
    ctx.roundRect(0, 0, 180, 180, 36);
    ctx.fill();
    ctx.strokeStyle = '#1A8CFF';
    ctx.lineWidth = 7;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(90, 78, 36, -Math.PI*0.5, Math.PI*0.75);
    ctx.stroke();
    ctx.fillStyle = '#F0F2F5';
    ctx.font = '800 40px Plus Jakarta Sans, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('K', 90, 80);
    ctx.fillStyle = '#7A8BA3';
    ctx.font = '600 13px Plus Jakarta Sans, sans-serif';
    ctx.fillText('kcal', 90, 140);
    const iconLink = document.createElement('link');
    iconLink.rel = 'apple-touch-icon';
    iconLink.href = c.toDataURL('image/png');
    document.head.appendChild(iconLink);
  } catch(e) {}
}

// ── Init ──
store.load();
setupPWA();
renderTabBar();
renderView();
</script>
