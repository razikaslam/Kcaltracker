<title>KcalTrack</title>

<style>
:root {
  --bg: #091321;
  --card: #132136;
  --card-alt: rgba(255,255,255,0.05);
  --blue: #1A8CFF;
  --green: #1AE6A6;
  --orange: #FF9E26;
  --purple: #9461FF;
  --red: #FF5C5C;
  --text: #F0F2F5;
  --text-sec: #7A8BA3;
  --border: rgba(255,255,255,0.06);
  --ring-track: rgba(255,255,255,0.08);
  --radius: 18px;
  --radius-sm: 12px;
  --tab-h: 56px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html {
  width: 100%;
  min-height: 100%;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

@media (max-width: 430px) {
  html, body {
    width: 100%;
    max-width: 100%;
  }

  input, select, button, textarea {
    -webkit-appearance: none;
  }

  /* Keep iOS Safari from zooming the page when a form field is focused. */
  input, select, textarea {
    font-size: 16px !important;
  }

  .form-input {
    width: 130px;
  }

  .view-title {
    font-size: 26px;
  }

  .card {
    padding: 15px;
  }

  .cal-ring-wrap {
    width: 180px;
    height: 180px;
  }

  .cal-ring-wrap svg {
    width: 180px;
    height: 180px;
  }

  .cal-ring-value {
    font-size: 32px;
  }

  .tab-btn {
    padding-left: 8px;
    padding-right: 8px;
  }
}

body {
  font-family: 'Plus Jakarta Sans', -apple-system, system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  overflow: hidden;
  height: 100dvh;
  position: fixed;
  width: 100%;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 430px;
  margin: 0 auto;
}

#content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain;
  padding-bottom: calc(var(--tab-h) + var(--safe-b) + 8px);
}

#content::-webkit-scrollbar { display: none; }

/* ── Tab Bar ── */
#tabbar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 430px;
  display: flex;
  align-items: center;
  justify-content: space-around;
  height: calc(var(--tab-h) + var(--safe-b));
  padding-bottom: var(--safe-b);
  background: rgba(9,19,33,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  z-index: 50;
}

.tab-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  background: none;
  border: none;
  color: var(--text-sec);
  font: 500 10px/1 'Plus Jakarta Sans', sans-serif;
  padding: 6px 12px;
  cursor: pointer;
  transition: color 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.tab-btn.active { color: var(--blue); }
.tab-btn svg { width: 22px; height: 22px; }

/* iPhone touch reliability for the fixed bottom navigation */
#tabbar {
  pointer-events: auto;
  touch-action: manipulation;
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}
.tab-btn {
  min-width: 52px;
  min-height: 44px;
  touch-action: manipulation;
}

/* ── Header ── */
.view-header {
  padding: 12px 20px 8px;
  padding-top: calc(12px + var(--safe-t));
}
.view-title { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
.view-subtitle { font-size: 14px; color: var(--text-sec); margin-top: 2px; }

/* ── Cards ── */
.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px;
}
.cards { display: flex; flex-direction: column; gap: 14px; padding: 0 16px 20px; }

/* ── Stat boxes ── */
.stat-row { display: flex; gap: 10px; }
.stat-box {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px;
  background: var(--card-alt);
  border-radius: var(--radius-sm);
}
.stat-icon { font-size: 18px; flex-shrink: 0; }
.stat-val { font-weight: 700; font-size: 15px; }
.stat-label { font-size: 11px; color: var(--text-sec); }

/* ── Macro rings row ── */
.rings-row {
  display: flex;
  justify-content: space-around;
  padding: 4px 0;
}
.ring-wrap { text-align: center; }

.macro-row {
  display: flex;
  justify-content: space-around;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.macro-cell { text-align: center; flex: 1; }
.macro-val { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.macro-label { font-size: 10px; color: var(--text-sec); margin-top: 2px; }

/* ── Weight card ── */
.weight-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.weight-diff { font-weight: 700; font-size: 15px; }

/* ── List items ── */
.list-section { padding: 0 16px; }
.list-section-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-sec);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 16px 0 8px;
}
.list-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  background: var(--card);
  border-radius: var(--radius-sm);
  margin-bottom: 6px;
}
.list-item-info { flex: 1; min-width: 0; }
.list-item-name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-item-meta { font-size: 12px; color: var(--text-sec); margin-top: 2px; }
.list-item-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; margin-left: 12px; }
.list-item-val { font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }

.del-btn {
  background: none; border: none; color: var(--red); cursor: pointer;
  padding: 6px; font-size: 16px; opacity: 0.7;
}
.del-btn:active { opacity: 1; }

/* ── Summary bar ── */
.summary-bar {
  display: flex;
  padding: 12px 16px;
  background: var(--card);
  border-radius: var(--radius-sm);
  margin: 0 16px 8px;
}
.summary-cell { flex: 1; text-align: center; }
.summary-val { font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
.summary-label { font-size: 10px; color: var(--text-sec); margin-top: 2px; }

/* ── Segment picker ── */
.seg-picker {
  display: flex;
  background: var(--card-alt);
  border-radius: 10px;
  padding: 3px;
  margin: 8px 16px 12px;
}
.seg-btn {
  flex: 1;
  padding: 8px;
  border: none;
  background: none;
  color: var(--text-sec);
  font: 600 13px/1 'Plus Jakarta Sans', sans-serif;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
}
.seg-btn.active {
  background: var(--card);
  color: var(--text);
}

/* ── Progress bars ── */
.progress-item { margin-bottom: 14px; }
.progress-header { display: flex; justify-content: space-between; margin-bottom: 6px; }
.progress-title { font-weight: 600; font-size: 14px; }
.progress-vals { font-size: 12px; color: var(--text-sec); font-variant-numeric: tabular-nums; }
.progress-track {
  height: 8px;
  background: var(--ring-track);
  border-radius: 4px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.5s ease;
}

/* ── Summary cards in progress ── */
.summary-card-row { display: flex; gap: 12px; }
.summary-card-item { flex: 1; }
.summary-card-label { font-size: 12px; color: var(--text-sec); }
.summary-card-val { font-size: 22px; font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; }
.summary-card-unit { font-size: 12px; color: var(--text-sec); margin-top: 1px; }

/* ── Forms ── */
.form-group {
  padding: 0 20px;
}
.form-section-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-sec);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 20px 0 8px;
}
.form-field {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  background: var(--card);
  border-radius: var(--radius-sm);
  margin-bottom: 6px;
}
.form-label { font-size: 15px; font-weight: 500; flex-shrink: 0; }
.form-input {
  background: none;
  border: none;
  color: var(--text);
  font: 500 15px 'Plus Jakarta Sans', sans-serif;
  text-align: right;
  width: 120px;
  outline: none;
  font-variant-numeric: tabular-nums;
}
.form-input::placeholder { color: var(--text-sec); }

.form-input-full {
  width: 100%;
  padding: 14px 16px;
  background: var(--card);
  border-radius: var(--radius-sm);
  border: none;
  color: var(--text);
  font: 500 15px 'Plus Jakarta Sans', sans-serif;
  outline: none;
  margin-bottom: 6px;
}
.form-input-full::placeholder { color: var(--text-sec); }

.form-select {
  background: none;
  border: none;
  color: var(--blue);
  font: 500 15px 'Plus Jakarta Sans', sans-serif;
  text-align: right;
  cursor: pointer;
  outline: none;
  -webkit-appearance: none;
  padding-right: 4px;
}
.form-select option { background: var(--card); color: var(--text); }

/* ── Stepper ── */
.stepper {
  display: flex;
  align-items: center;
  gap: 12px;
}
.stepper-btn {
  width: 32px; height: 32px;
  border-radius: 50%;
  border: none;
  background: var(--card-alt);
  color: var(--blue);
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.stepper-btn:active { background: var(--blue); color: var(--text); }
.stepper-val { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 28px; text-align: center; }

/* ── Modal ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
.modal-overlay.active { opacity: 1; pointer-events: auto; }

.modal-sheet {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%) translateY(100%);
  width: 100%;
  max-width: 430px;
  background: var(--bg);
  border-radius: 24px 24px 0 0;
  max-height: 90dvh;
  overflow-y: auto;
  transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
  z-index: 101;
  padding-bottom: calc(20px + var(--safe-b));
}
.modal-overlay.active .modal-sheet { transform: translateX(-50%) translateY(0); }

.modal-handle {
  width: 36px;
  height: 5px;
  background: rgba(255,255,255,0.2);
  border-radius: 3px;
  margin: 10px auto 0;
}
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
}
.modal-title { font-size: 18px; font-weight: 700; }
.modal-btn {
  background: none;
  border: none;
  font: 600 15px 'Plus Jakarta Sans', sans-serif;
  cursor: pointer;
  padding: 6px 2px;
}
.modal-cancel { color: var(--text-sec); }
.modal-save { color: var(--blue); }
.modal-save:disabled { color: var(--text-sec); opacity: 0.5; }

/* ── Pill picker (meal selector) ── */
.pill-row { display: flex; gap: 8px; padding: 0 20px 8px; overflow-x: auto; }
.pill-btn {
  padding: 8px 16px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: none;
  color: var(--text-sec);
  font: 500 13px 'Plus Jakarta Sans', sans-serif;
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.2s;
}
.pill-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; }

/* ── Empty state ── */
.empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-sec);
}
.empty-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.4; }
.empty-text { font-size: 14px; }

/* ── FAB ── */
.fab {
  position: fixed;
  bottom: calc(var(--tab-h) + var(--safe-b) + 16px);
  right: max(16px, calc((100% - 430px)/2 + 16px));
  width: 52px;
  height: 52px;
  border-radius: 50%;
  border: none;
  background: var(--blue);
  color: #fff;
  font-size: 28px;
  font-weight: 300;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(26,140,255,0.35);
  z-index: 40;
  transition: transform 0.15s;
}
.fab:active { transform: scale(0.92); }

/* ── Animations ── */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.animate-in { animation: fadeIn 0.3s ease both; }

/* ── Calorie ring center ── */
.cal-ring-center {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}
.cal-ring-value { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; }
.cal-ring-target { font-size: 13px; color: var(--text-sec); }
.cal-ring-left { font-size: 12px; color: var(--green); font-weight: 600; margin-top: 2px; }

.cal-ring-wrap {
  position: relative;
  width: 190px;
  height: 190px;
  margin: 4px auto 12px;
}

/* ── Date navigator ── */
.date-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 16px 12px;
}
.date-nav-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: none;
  background: var(--card);
  color: var(--text);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.date-nav-btn:active { background: var(--blue); }
.date-nav-btn:disabled { opacity: 0.25; pointer-events: none; }
.date-nav-center { text-align: center; cursor: pointer; position: relative; }
.date-nav-label { font-weight: 700; font-size: 16px; }
.date-nav-sub { font-size: 11px; color: var(--text-sec); margin-top: 1px; }
.date-nav-input {
  position: absolute;
  inset: 0;
  opacity: 0;
  width: 100%;
  height: 100%;
  cursor: pointer;
  font-size: 16px;
  -webkit-appearance: none;
}

/* ── Date field in modal ── */
.date-field {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  background: var(--card);
  border-radius: var(--radius-sm);
  margin: 0 20px 8px;
}
.date-field-label { font-size: 15px; font-weight: 500; }
.date-field-input {
  background: none;
  border: none;
  color: var(--blue);
  font: 500 15px 'Plus Jakarta Sans', sans-serif;
  outline: none;
  -webkit-appearance: none;
  text-align: right;
}

/* ── Workout icon ── */
.wo-icon {
  width: 40px; height: 40px;
  border-radius: 10px;
  background: rgba(255,158,38,0.12);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  color: var(--orange);
  flex-shrink: 0;
  margin-right: 12px;
}

.auth-overlay{position:fixed;inset:0;z-index:10000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;}
.auth-box{width:min(100%,390px);background:var(--card);border:1px solid var(--border);border-radius:22px;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.35);}

</style>

<script>
const SUPABASE_URL = 'https://pikhgfyxqgtdjkzzducf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_BIxFvhlRGRh1nAbqZBqbbQ_SsX487M7';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY, { db: { schema: 'kcaltracker' }, auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
let cloudUser = null;
let cloudReady = false;
let cloudSyncing = false;

const TABS = [
  { id:'home', label:'Home', icon:`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 11.5l8-7 8 7V20a1 1 0 01-1 1h-4.5v-5.5a1 1 0 00-1-1h-3a1 1 0 00-1 1V21H5a1 1 0 01-1-1z"/></svg>` },
  { id:'food', label:'Food', icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 3v7a3 3 0 003 3m0 0v8m0-11a3 3 0 003-3V3m-3 0v10M18 3c0 3-.8 6-.8 8s.8 2.5.8 2.5V21"/></svg>` },
  { id:'workout', label:'Workout', icon:`<svg viewBox="0 0 24 24" fill="currentColor"><rect x="1" y="9" width="2.5" height="6" rx="1"/><rect x="4.5" y="6.5" width="3" height="11" rx="1"/><rect x="16.5" y="6.5" width="3" height="11" rx="1"/><rect x="20.5" y="9" width="2.5" height="6" rx="1"/><rect x="7.5" y="10.5" width="9" height="3" rx=".5"/></svg>` },
  { id:'progress', label:'Progress', icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20l5.5-7 4 4.5L22 6"/></svg>` },
  { id:'profile', label:'More', icon:`<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/></svg>` }
];

const MEALS = ['Breakfast','Lunch','Dinner','Snack'];
const WO_TYPES = ['Weight Training','Running','Cycling','Walking','HIIT','Swimming','Yoga','Sports','Other'];

// ── Data Store ──
const store = {
  foods: [],
  workouts: [],
  weights: [],
  profile: {
    name:'', age:25, height:170, currentWeight:70, goalWeight:65,
    sex:'Male', activity:'Moderately Active',
    calorieTarget:2000, proteinTarget:125, carbTarget:230,
    fatTarget:80, fiberTarget:30, workoutTarget:300
  },

  get todayFoods() { return this.foods.filter(f => isToday(f.date)); },
  get todayWorkouts() { return this.workouts.filter(w => isToday(w.date)); },
  get todayKcal() { return this.todayFoods.reduce((s,f) => s+f.kcal, 0); },
  get todayProtein() { return this.todayFoods.reduce((s,f) => s+f.protein, 0); },
  get todayCarbs() { return this.todayFoods.reduce((s,f) => s+f.carbs, 0); },
  get todayFat() { return this.todayFoods.reduce((s,f) => s+f.fat, 0); },
  get todayFiber() { return this.todayFoods.reduce((s,f) => s+f.fiber, 0); },
  get todayBurn() { return this.todayWorkouts.reduce((s,w) => s+w.kcal, 0); },
  get netKcal() { return this.todayKcal - this.todayBurn; },

  foodsForLast(days) {
    const start = new Date(); start.setHours(0,0,0,0);
    start.setDate(start.getDate() - (days - 1));
    return this.foods.filter(f => new Date(f.date) >= start);
  },
  workoutsForLast(days) {
    const start = new Date(); start.setHours(0,0,0,0);
    start.setDate(start.getDate() - (days - 1));
    return this.workouts.filter(w => new Date(w.date) >= start);
  },

  addFood(entry, date) { entry.id = uid(); entry.date = (date || new Date()).toISOString(); this.foods.unshift(entry); this.save(); this.syncFood(entry); },
  deleteFood(id) { this.foods = this.foods.filter(f => f.id !== id); this.save(); this.deleteCloud('food_entries', id); },
  addWorkout(entry, date) { entry.id = uid(); entry.date = (date || new Date()).toISOString(); this.workouts.unshift(entry); this.save(); this.syncWorkout(entry); },
  deleteWorkout(id) { this.workouts = this.workouts.filter(w => w.id !== id); this.save(); this.deleteCloud('workout_entries', id); },
  addWeight(val) {
    const entry = { id: uid(), date: new Date().toISOString(), weight: n(val) };
    this.weights.unshift(entry);
    this.profile.currentWeight = n(val);
    this.save();
    this.syncWeight(entry);
    this.syncProfile();
  },

  save() {
    try {
      localStorage.setItem('kt_foods', JSON.stringify(this.foods));
      localStorage.setItem('kt_workouts', JSON.stringify(this.workouts));
      localStorage.setItem('kt_weights', JSON.stringify(this.weights));
      localStorage.setItem('kt_profile', JSON.stringify(this.profile));
    } catch(e) {}
    if (cloudReady && !cloudSyncing) this.syncProfile();
  },
  loadLocal() {
    try {
      const f = localStorage.getItem('kt_foods');
      const w = localStorage.getItem('kt_workouts');
      const wt = localStorage.getItem('kt_weights');
      const p = localStorage.getItem('kt_profile');
      if (f) this.foods = JSON.parse(f);
      if (w) this.workouts = JSON.parse(w);
      if (wt) this.weights = JSON.parse(wt);
      if (p) {
        Object.assign(this.profile, JSON.parse(p));
        ['age','height','currentWeight','goalWeight','calorieTarget','proteinTarget','carbTarget','fatTarget','fiberTarget','workoutTarget']
          .forEach(k => { this.profile[k] = n(this.profile[k], 0); });
      }
    } catch(e) {}
  },
  async syncProfile() {
    if (!cloudUser) return;
    const p = this.profile;
    const row = { id: cloudUser.id, name:p.name, age:n(p.age), height:n(p.height), current_weight:n(p.currentWeight), goal_weight:n(p.goalWeight), sex:p.sex, activity:p.activity, calorie_target:n(p.calorieTarget), protein_target:n(p.proteinTarget), carb_target:n(p.carbTarget), fat_target:n(p.fatTarget), fiber_target:n(p.fiberTarget), workout_target:n(p.workoutTarget,300), updated_at:new Date().toISOString() };
    const { error } = await sb.from('profiles').upsert(row, { onConflict:'id' });
    if (error) console.warn('Profile sync failed:', error.message);
  },
  async syncFood(f) {
    if (!cloudUser) return;
    const row = { id:f.id, user_id:cloudUser.id, date:f.date, name:f.name, quantity:null, unit:null, calories:n(f.kcal), protein:n(f.protein), carbs:n(f.carbs), fat:n(f.fat), fiber:n(f.fiber), meal:f.meal || null, notes:null };
    const { error } = await sb.from('food_entries').upsert(row, { onConflict:'id' });
    if (error) console.warn('Food sync failed:', error.message);
  },
  async syncWorkout(w) {
    if (!cloudUser) return;
    const row = { id:w.id, user_id:cloudUser.id, date:w.date, name:w.type || 'Workout', duration:n(w.minutes), calories_burned:n(w.kcal), notes:null };
    const { error } = await sb.from('workout_entries').upsert(row, { onConflict:'id' });
    if (error) console.warn('Workout sync failed:', error.message);
  },
  async syncWeight(w) {
    if (!cloudUser) return;
    const row = { id:w.id, user_id:cloudUser.id, date:w.date, weight:n(w.weight) };
    const { error } = await sb.from('weight_entries').upsert(row, { onConflict:'id' });
    if (error) console.warn('Weight sync failed:', error.message);
  },
  async deleteCloud(table, id) {
    if (!cloudUser) return;
    const { error } = await sb.from(table).delete().eq('id', id);
    if (error) console.warn('Delete sync failed:', error.message);
  },
  load() { this.loadLocal(); }
};

// ── Helpers ──
function uid() { return crypto.randomUUID(); }
function isToday(d) { const t = new Date(), dd = new Date(d); return t.toDateString() === dd.toDateString(); }
function clamp(v, lo, hi) { return Math.min(Math.max(v, lo), hi); }
function r(v) {
  const x = Number(v);
  if (!Number.isFinite(x)) return 0;
  return Number.isInteger(x) ? x : Number(x.toFixed(2));
}
function n(v, fallback=0) {
  const x = Number(v);
  return Number.isFinite(x) ? x : fallback;
}

function greeting() {
  const h = new Date().getHours();
  const t = h < 12 ? 'Morning' : h < 17 ? 'Afternoon' : 'Evening';
  const e = h < 12 ? '☀️' : h < 17 ? '🌤️' : '🌙';
  const n = store.profile.name || 'there';
  return `Good ${t}, ${n} ${e}`;
}

function ringSVG(value, total, color, size, label) {
  const sw = size > 100 ? 14 : 6;
  const rad = (size - sw) / 2;
  const circ = 2 * Math.PI * rad;
  const p = clamp(total > 0 ? value / total : 0, 0, 1);
  const off = circ * (1 - p);
  const cx = size/2, cy = size/2;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${cx}" cy="${cy}" r="${rad}" fill="none" stroke="var(--ring-track)" stroke-width="${sw}"/>
    <circle cx="${cx}" cy="${cy}" r="${rad}" fill="none" stroke="${color}" stroke-width="${sw}"
      stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${off}"
      transform="rotate(-90 ${cx} ${cy})" style="transition:stroke-dashoffset .6s ease"/>
    ${label ? `<text x="${cx}" y="${cy-5}" text-anchor="middle" fill="var(--text)" font-size="14" font-weight="700" font-family="Plus Jakarta Sans,sans-serif">${r(value)}</text>
    <text x="${cx}" y="${cy+10}" text-anchor="middle" fill="var(--text-sec)" font-size="9" font-family="Plus Jakarta Sans,sans-serif">${label}</text>
    <text x="${cx}" y="${cy+24}" text-anchor="middle" fill="${color}" font-size="9" font-weight="700" font-family="Plus Jakarta Sans,sans-serif">${r(p*100)}%</text>` : ''}
  </svg>`;
}

function calRingSVG() {
  const val = store.todayKcal, tot = store.profile.calorieTarget;
  const size = 190, sw = 14, rad = (size-sw)/2;
  const circ = 2 * Math.PI * rad;
  const p = clamp(tot > 0 ? val / tot : 0, 0, 1);
  const off = circ * (1 - p);
  const cx = size/2;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="var(--blue)"/><stop offset="1" stop-color="var(--green)"/></linearGradient></defs>
    <circle cx="${cx}" cy="${cx}" r="${rad}" fill="none" stroke="var(--ring-track)" stroke-width="${sw}"/>
    <circle cx="${cx}" cy="${cx}" r="${rad}" fill="none" stroke="url(#cg)" stroke-width="${sw}"
      stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${off}"
      transform="rotate(-90 ${cx} ${cx})" style="transition:stroke-dashoffset .6s ease"/>
  </svg>`;
}

function woIcon(type) {
  const t = type.toLowerCase();
  if (t.includes('run') || t.includes('walk')) return '🏃';
  if (t.includes('cycl')) return '🚴';
  if (t.includes('swim')) return '🏊';
  if (t.includes('yoga')) return '🧘';
  if (t.includes('hiit')) return '⚡';
  if (t.includes('sport')) return '⚽';
  return '🏋️';
}

function isSameDay(d1, d2) { return new Date(d1).toDateString() === new Date(d2).toDateString(); }

function foodsForDate(date) { return store.foods.filter(f => isSameDay(f.date, date)); }
function kcalForDate(date) { return foodsForDate(date).reduce((s,f) => s+f.kcal, 0); }
function proteinForDate(date) { return foodsForDate(date).reduce((s,f) => s+f.protein, 0); }
function carbsForDate(date) { return foodsForDate(date).reduce((s,f) => s+f.carbs, 0); }
function fatForDate(date) { return foodsForDate(date).reduce((s,f) => s+f.fat, 0); }

function toDateStr(d) { const dd = new Date(d); return `${dd.getFullYear()}-${String(dd.getMonth()+1).padStart(2,'0')}-${String(dd.getDate()).padStart(2,'0')}`; }
function toDisplayDate(d) {
  const dd = new Date(d);
  const today = new Date(); today.setHours(0,0,0,0);
  const yesterday = new Date(today); yesterday.setDate(yesterday.getDate()-1);
  if (dd.toDateString() === today.toDateString()) return 'Today';
  if (dd.toDateString() === yesterday.toDateString()) return 'Yesterday';
  return dd.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
}
function toFullDate(d) {
  return new Date(d).toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric', year:'numeric' });
}
function shiftDate(d, days) {
  const dd = new Date(d);
  dd.setDate(dd.getDate() + days);
  return dd;
}

function startOfWeek(d) {
  const x = new Date(d); x.setHours(0,0,0,0);
  const day = x.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  x.setDate(x.getDate() + diff);
  return x;
}
function startOfMonth(d) {
  const x = new Date(d); x.setHours(0,0,0,0);
  x.setDate(1);
  return x;
}
function periodData(period) {
  const now = new Date(); now.setHours(0,0,0,0);
  let start, elapsedDays;
  if (period === 'day') { start = new Date(now); elapsedDays = 1; }
  else if (period === 'week') { start = startOfWeek(now); elapsedDays = Math.floor((now-start)/86400000)+1; }
  else { start = startOfMonth(now); elapsedDays = Math.floor((now-start)/86400000)+1; }
  const end = new Date(now); end.setHours(23,59,59,999);
  const inRange = (d) => { const x = new Date(d); return x >= start && x <= end; };
  const foods = store.foods.filter(f => inRange(f.date));
  const workouts = store.workouts.filter(w => inRange(w.date));
  return { start, end, elapsedDays, foods, workouts,
    kcal: foods.reduce((s,f)=>s+f.kcal,0), protein: foods.reduce((s,f)=>s+f.protein,0),
    carbs: foods.reduce((s,f)=>s+f.carbs,0), fat: foods.reduce((s,f)=>s+f.fat,0), fiber: foods.reduce((s,f)=>s+f.fiber,0),
    burn: workouts.reduce((s,w)=>s+w.kcal,0) };
}

function renderTabBar() {
  $tabbar.innerHTML = TABS.map((t,i) =>
    `<button type="button" class="tab-btn${i===currentTab?' active':''}" data-tab="${i}">${t.icon}<span>${t.label}</span></button>`
  ).join('');

  // Bind navigation directly to the buttons as well as the existing
  // delegated handler. This makes the fixed nav more reliable on iOS Safari.
  $tabbar.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => switchTab(parseInt(btn.dataset.tab, 10)));
  });
}

function switchTab(i) {
  if (i === currentTab && $content.scrollTop === 0) return;
  if (currentTab === 4 && i !== 4) {
    profileDraft = null;
    profileSaveMessage = '';
  }
  currentTab = i;
  renderTabBar();
  renderView();
  $content.scrollTop = 0;
}

function renderView() {
  const fab = document.querySelector('.fab');
  if (fab) fab.remove();

  switch(currentTab) {
    case 0: renderHome(); break;
    case 1: renderFood(); break;
    case 2: renderWorkout(); break;
    case 3: renderProgress(); break;
    case 4: renderProfile(); break;
  }
}

// ── Progress View ──
function renderProgress() {
  const now = new Date(); now.setHours(0,0,0,0);
  let start, end, days, elapsedDays, workoutTarget;

  if (progressPeriod === 7) {
    // Calendar week: Monday through Sunday.
    start = startOfWeek(now);
    end = new Date(start);
    end.setDate(end.getDate() + 6);
    end.setHours(23,59,59,999);
    days = 7;
    elapsedDays = Math.floor((now - start) / 86400000) + 1;
    workoutTarget = store.profile.workoutTarget * 4;
  } else if (progressPeriod === 30) {
    // Calendar month: 1st through the last day of the current month.
    start = startOfMonth(now);
    end = new Date(now.getFullYear(), now.getMonth() + 1, 0);
    end.setHours(23,59,59,999);
    days = end.getDate();
    elapsedDays = Math.floor((now - start) / 86400000) + 1;
    // Full-calendar-month target, based on 4 workout days/week.
    workoutTarget = store.profile.workoutTarget * (4 / 7) * days;
  } else {
    // Keep 3 Months as a rolling 90-day period.
    start = new Date(now);
    start.setDate(start.getDate() - 89);
    end = new Date(now);
    end.setHours(23,59,59,999);
    days = 90;
    elapsedDays = 90;
    workoutTarget = store.profile.workoutTarget * (4 / 7) * days;
  }

  const inRange = (d) => { const x = new Date(d); return x >= start && x <= end; };
  const fs = store.foods.filter(f => inRange(f.date));
  const ws = store.workouts.filter(w => inRange(w.date));
  const avgIn = fs.reduce((s,f)=>s+f.kcal,0) / Math.max(elapsedDays,1);
  const avgBurn = ws.reduce((s,w)=>s+w.kcal,0) / Math.max(elapsedDays,1);
  const totP = fs.reduce((s,f)=>s+f.protein,0);
  const totC = fs.reduce((s,f)=>s+f.carbs,0);
  const totF = fs.reduce((s,f)=>s+f.fat,0);
  const totKcal = fs.reduce((s,f)=>s+f.kcal,0);
  const totBurn = ws.reduce((s,w)=>s+w.kcal,0);

  function pbar(label, val, target, color) {
    const p = clamp(target > 0 ? val/target : 0, 0, 1);
    return `<div class="progress-item">
      <div class="progress-header"><span class="progress-title">${label}</span><span class="progress-vals">${r(val)} / ${r(target)}</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:${p*100}%;background:${color}"></div></div>
    </div>`;
  }

  $content.innerHTML = `
    <div class="view-header"><div class="view-title">Progress</div></div>
    <div class="seg-picker">
      <button class="seg-btn${days===7?' active':''}" data-period="7">Week</button>
      <button class="seg-btn${days===30?' active':''}" data-period="30">Month</button>
      <button class="seg-btn${days===90?' active':''}" data-period="90">3 Months</button>
    </div>
    <div class="cards animate-in">
      <div class="card">
        <div class="summary-card-row">
          <div class="summary-card-item"><div class="summary-card-label">Avg. Daily Intake</div><div class="summary-card-val">${r(avgIn)}</div><div class="summary-card-unit">kcal</div></div>
          <div class="summary-card-item"><div class="summary-card-label">Avg. Daily Burn</div><div class="summary-card-val">${r(avgBurn)}</div><div class="summary-card-unit">kcal</div></div>
        </div>
      </div>
      <div class="card">
        <div class="summary-card-row">
          <div class="summary-card-item"><div class="summary-card-label">Protein</div><div class="summary-card-val">${r(totP)}</div><div class="summary-card-unit">g total</div></div>
          <div class="summary-card-item"><div class="summary-card-label">Target</div><div class="summary-card-val">${r(store.profile.proteinTarget * days)}</div><div class="summary-card-unit">g expected</div></div>
        </div>
      </div>
      <div class="card">
        <div style="font-size:16px;font-weight:700;margin-bottom:14px">Nutrition vs Target</div>
        ${pbar('Calories', totKcal, store.profile.calorieTarget*days, 'var(--blue)')}
        ${pbar('Protein', totP, store.profile.proteinTarget*days, 'var(--green)')}
        ${pbar('Carbs', totC, store.profile.carbTarget*days, 'var(--orange)')}
        ${pbar('Fat', totF, store.profile.fatTarget*days, 'var(--purple)')}
      </div>
      <div class="card">
        <div style="font-size:16px;font-weight:700;margin-bottom:14px">Workout</div>
        <div style="display:flex;align-items:center;gap:16px">
          ${ringSVG(totBurn, workoutTarget, 'var(--orange)', 70, 'Burn')}
          <div>
            <div style="font-size:20px;font-weight:800">${ws.length} sessions</div>
            <div style="font-size:13px;color:var(--text-sec)">${r(totBurn)} / ${r(workoutTarget)} kcal burned</div>
          </div>
        </div>
      </div>
    </div>`;
}

async function saveProfileChanges() {
  if (!profileDraft) return;
  const btn = document.querySelector('[data-save-profile]');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  profileSaveMessage = '';
  try {
    store.profile = JSON.parse(JSON.stringify(profileDraft));
    store.save();
    if (cloudUser) {
      await store.syncProfile();
    }
    profileSaveMessage = 'Saved ✓';
    if (btn) { btn.disabled = false; btn.textContent = 'Save Changes'; }
    renderProfile();
    const confirm = document.querySelector('[data-profile-save-confirm]');
    if (confirm) {
      requestAnimationFrame(() => confirm.classList.add('show'));
      setTimeout(() => {
        confirm.classList.remove('show');
        setTimeout(() => { if (confirm.isConnected) confirm.textContent = ''; }, 300);
        profileSaveMessage = '';
      }, 1700);
    }
  } catch (err) {
    profileSaveMessage = 'Could not save changes';
    if (btn) { btn.disabled = false; btn.textContent = 'Save Changes'; }
    renderProfile();
    console.warn('Profile save failed:', err);
  }
}

async function signOut() {
  if (!cloudUser) return;
  const btn = document.getElementById('logout-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Signing out…'; }
  const { error } = await sb.auth.signOut();
  if (error) {
    if (btn) { btn.disabled = false; btn.textContent = 'Sign Out'; }
    showCloudStatus('Sign out failed — ' + error.message);
    return;
  }
  cloudUser = null;
  cloudReady = false;
  cloudSyncing = false;
  showAuthOverlay();
  showCloudStatus('Signed out');
}

// ── Escape HTML ──
function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

// ── Event Delegation ──
document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab) { switchTab(parseInt(tab.dataset.tab)); return; }

  const delFood = e.target.closest('[data-del-food]');
  if (delFood) { store.deleteFood(delFood.dataset.delFood); renderView(); return; }

  const delWo = e.target.closest('[data-del-wo]');
  if (delWo) { store.deleteWorkout(delWo.dataset.delWo); renderView(); return; }

  const hp = e.target.closest('[data-home-period]');
  if (hp) { homePeriod = hp.dataset.homePeriod; renderView(); return; }

  const seg = e.target.closest('[data-period]');
  if (seg) { progressPeriod = parseInt(seg.dataset.period); renderView(); return; }

  const wShift = e.target.closest('[data-workout-date-shift]');
  if (wShift) {
    workoutViewDate = shiftDate(workoutViewDate, parseInt(wShift.dataset.workoutDateShift));
    renderView(); return;
  }

  const dateShift = e.target.closest('[data-date-shift]');
  if (dateShift) {
    const delta = parseInt(dateShift.dataset.dateShift);
    foodViewDate = shiftDate(foodViewDate, delta);
    renderView();
    return;
  }

  const step = e.target.closest('[data-step]');
  if (step) {
    const [field, delta] = step.dataset.step.split(',');
    if (!profileDraft) profileDraft = JSON.parse(JSON.stringify(store.profile));
    profileDraft[field] = clamp(profileDraft[field] + parseInt(delta), 1, 120);
    profileSaveMessage = '';
    renderProfile();
    return;
  }

  const saveProfile = e.target.closest('[data-save-profile]');
  if (saveProfile) {
    saveProfileChanges();
    return;
  }
});

document.addEventListener('input', e => {
  const prof = e.target.dataset?.profile;
  if (prof) {
    if (!profileDraft) profileDraft = JSON.parse(JSON.stringify(store.profile));
    if (e.target.dataset.type === 'num') {
      profileDraft[prof] = parseFloat(e.target.value) || 0;
    } else {
      profileDraft[prof] = e.target.value;
    }
    profileSaveMessage = '';
  }
});

document.addEventListener('change', e => {
  const prof = e.target.dataset?.profile;
  if (prof) {
    if (!profileDraft) profileDraft = JSON.parse(JSON.stringify(store.profile));
    profileDraft[prof] = e.target.value;
    profileSaveMessage = '';
  }
  const datePick = e.target.dataset?.datePick;
  if (datePick === 'food' && e.target.value) {
    foodViewDate = new Date(e.target.value + 'T00:00:00');
    renderView();
  }
  if (datePick === 'workout' && e.target.value) {

    renderView();
  }
});

// ── PWA Manifest (inline) ──
function setupPWA() {
  const manifest = {
    name: 'KcalTrack',
    short_name: 'KcalTrack',
    display: 'standalone',
    background_color: '#091321',
    theme_color: '#091321',
    start_url: '.',
    scope: '.'
  };
  const blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = URL.createObjectURL(blob);
  document.head.appendChild(link);

  // Generate app icon
  try {
    const c = document.createElement('canvas');
    c.width = c.height = 180;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#091321';
    ctx.beginPath();
    ctx.roundRect(0, 0, 180, 180, 36);
    ctx.fill();
    ctx.strokeStyle = '#1A8CFF';
    ctx.lineWidth = 7;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(90, 78, 36, -Math.PI*0.5, Math.PI*0.75);
    ctx.stroke();
    ctx.fillStyle = '#F0F2F5';
    ctx.font = '800 40px Plus Jakarta Sans, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('K', 90, 80);
    ctx.fillStyle = '#7A8BA3';
    ctx.font = '600 13px Plus Jakarta Sans, sans-serif';
    ctx.fillText('kcal', 90, 140);
    const iconLink = document.createElement('link');
    iconLink.rel = 'apple-touch-icon';
    iconLink.href = c.toDataURL('image/png');
    document.head.appendChild(iconLink);
  } catch(e) {}
}

  }
}

    const email=document.getElementById('auth-email').value.trim();
    const password=document.getElementById('auth-password').value;
    const {data,error}=await sb.auth.signInWithPassword({email,password});
    if(error){msg.textContent=error.message;return;}
    el.style.display='none'; cloudUser=data.user; cloudReady=true; await syncFromCloud();
  };
  document.getElementById('auth-signup').onclick=async()=>{
    msg.textContent='Creating account…';
    const email=document.getElementById('auth-email').value.trim();
    const password=document.getElementById('auth-password').value;
    if(password.length<6){msg.textContent='Password must be at least 6 characters.';return;}
    const {data,error}=await sb.auth.signUp({email,password});
    if(error){msg.textContent=error.message;return;}
    if(data.session){el.style.display='none'; cloudUser=data.user; cloudReady=true; await syncFromCloud();}
    else msg.textContent='Account created. Check your email to confirm, then sign in.';
  };
}

async function syncFromCloud() {
  if (!cloudUser) return;
  cloudSyncing = true;
  try {
    const [pRes, fRes, wRes, wtRes] = await Promise.all([
      sb.from('profiles').select('*').eq('id', cloudUser.id).maybeSingle(),
      sb.from('food_entries').select('*').eq('user_id', cloudUser.id).order('created_at', {ascending:false}),
      sb.from('workout_entries').select('*').eq('user_id', cloudUser.id).order('created_at', {ascending:false}),
      sb.from('weight_entries').select('*').eq('user_id', cloudUser.id).order('created_at', {ascending:false})
    ]);
    if (pRes.error) throw pRes.error;
    if (fRes.error) throw fRes.error;
    if (wRes.error) throw wRes.error;
    if (wtRes.error) throw wtRes.error;

    // Migrate existing local data only when the corresponding cloud collection is empty.
    if (!pRes.data) await store.syncProfile();
    else {
      const p=pRes.data;
      Object.assign(store.profile, { name:p.name||'', age:n(p.age,25), height:n(p.height,170), currentWeight:n(p.current_weight,70), goalWeight:n(p.goal_weight,65), sex:p.sex||'Male', activity:p.activity||'Moderately Active', calorieTarget:n(p.calorie_target,2000), proteinTarget:n(p.protein_target,125), carbTarget:n(p.carb_target,230), fatTarget:n(p.fat_target,80), fiberTarget:n(p.fiber_target,30), workoutTarget:n(p.workout_target,300) });
    }
    if ((fRes.data||[]).length) {
      store.foods = fRes.data.map(f => ({ id:f.id, date:f.date, meal:f.meal||'Breakfast', name:f.name, kcal:n(f.calories), protein:n(f.protein), carbs:n(f.carbs), fat:n(f.fat), fiber:n(f.fiber) }));
    } else { for (const f of store.foods) await store.syncFood(f); }
    if ((wRes.data||[]).length) {
      store.workouts = wRes.data.map(w => ({ id:w.id, date:w.date, type:w.name||'Workout', minutes:n(w.duration), kcal:n(w.calories_burned) }));
    } else { for (const w of store.workouts) await store.syncWorkout(w); }
    if ((wtRes.data||[]).length) {
      store.weights = wtRes.data.map(w => ({ id:w.id, date:w.date, weight:n(w.weight) }));
    } else { for (const w of store.weights) await store.syncWeight(w); }
    store.save();
    renderView();
    showCloudStatus('Cloud sync connected ✓');
  } catch(e) {
    console.warn('Cloud sync failed:', e.message);
    showCloudStatus('Cloud sync unavailable — using local data');
  } finally {
    cloudSyncing = false;
  }
}

function showCloudStatus(msg) {
  let el=document.getElementById('cloud-status');
  if(!el){ el=document.createElement('div'); el.id='cloud-status'; el.style.cssText='position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:50%;transform:translateX(-50%);z-index:9999;background:#162337;color:#dfe7f2;padding:7px 12px;border-radius:999px;font:600 11px Plus Jakarta Sans,sans-serif;box-shadow:0 4px 20px rgba(0,0,0,.25);pointer-events:none;'; document.body.appendChild(el); }
  el.textContent=msg; clearTimeout(el._t); el._t=setTimeout(()=>el.remove(),2500);
}

// ── Init ──
store.load();
setupPWA();
renderTabBar();
renderView();
connectCloud();
</script>
