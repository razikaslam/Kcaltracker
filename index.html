<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KcalTrack</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#091321">
<meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #060D19;
  --card: #101D31;
  --card-alt: rgba(255,255,255,0.05);
  --blue: #36A3FF;
  --green: #35F0B5;
  --orange: #FF9E26;
  --purple: #9461FF;
  --red: #FF5C5C;
  --text: #F0F2F5;
  --text-sec: #7A8BA3;
  --border: rgba(255,255,255,0.06);
  --ring-track: rgba(255,255,255,0.08);
  --radius: 18px;
  --radius-sm: 12px;
  --tab-h: 56px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html {
  width: 100%;
  min-height: 100%;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

@media (max-width: 430px) {
  html, body {
    width: 100%;
    max-width: 100%;
  }

  input, select, button, textarea {
    -webkit-appearance: none;
  }

  /* Keep iOS Safari from zooming the page when a form field is focused. */
  input, select, textarea {
    font-size: 16px !important;
  }

  .form-input {
    width: 130px;
  }

  .view-title {
    font-size: 26px;
  }

  .card {
    padding: 15px;
  }

  .cal-ring-wrap {
    width: 180px;
    height: 180px;
  }

  .cal-ring-wrap svg {
    width: 180px;
    height: 180px;
  }

  .cal-ring-value {
    font-size: 32px;
  }

  .tab-btn {
    padding-left: 8px;
    padding-right: 8px;
  }
}

body {
  font-family: 'Plus Jakarta Sans', -apple-system, system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  overflow: hidden;
  height: 100dvh;
  position: fixed;
  width: 100%;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 430px;
  margin: 0 auto;
}

#content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain;
  padding-bottom: calc(var(--tab-h) + var(--safe-b) + 8px);
}

#content::-webkit-scrollbar { display: none; }

/* ── Tab Bar ── */
#tabbar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 430px;
  display: flex;
  align-items: center;
  justify-content: space-around;
  height: calc(var(--tab-h) + var(--safe-b));
  padding-bottom: var(--safe-b);
  background: rgba(9,19,33,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  z-index: 50;
}

.tab-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  background: none;
  border: none;
  color: var(--text-sec);
  font: 500 10px/1 'Plus Jakarta Sans', sans-serif;
  padding: 6px 12px;
  cursor: pointer;
  transition: color 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.tab-btn.active { color: var(--blue); }
.tab-btn svg { width: 22px; height: 22px; }

/* iPhone touch reliability for the fixed bottom navigation */
#tabbar {
  pointer-events: auto;
  touch-action: manipulation;
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}
#tabbar::after {
  content:""; position:absolute; left:0; right:0; bottom:calc(-1 * var(--safe-b)); height:var(--safe-b);
  background:rgba(9,19,33,0.92); z-index:-1;
}
@supports (-webkit-touch-callout: none) {
  #tabbar { bottom:0; }
}
.tab-btn {
  min-width: 52px;
  min-height: 44px;
  touch-action: manipulation;
}

/* ── Header ── */
.view-header {
  padding: 12px 20px 8px;
  padding-top: calc(12px + var(--safe-t));
}
.view-title { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
.home-greeting { white-space: nowrap; font-size: clamp(22px, 7vw, 28px); letter-spacing: -0.7px; }
.view-subtitle { font-size: 14px; color: var(--text-sec); margin-top: 2px; }
.daily-quote { margin-top: 7px; }

/* ── Cards ── */
.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px;
}
.cards { display: flex; flex-direction: column; gap: 14px; padding: 0 16px 20px; }

/* ── Stat boxes ── */
.stat-row { display: flex; gap: 10px; }
.stat-box {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px;
  background: var(--card-alt);
  border-radius: var(--radius-sm);
}
.stat-icon { font-size: 18px; flex-shrink: 0; }
.stat-val { font-weight: 700; font-size: 15px; }
.stat-label { font-size: 11px; color: var(--text-sec); }

/* ── Macro rings row ── */
.rings-row {
  display: flex;
  justify-content: space-around;
  padding: 4px 0;
}
.ring-wrap { text-align: center; }

.macro-row {
  display: flex;
  justify-content: space-around;
  gap: 8px;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.macro-cell { text-align: center; flex: 1 1 0; min-width: 0; }
.macro-val { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: -0.25px; }
.macro-label { font-size: 10px; color: var(--text-sec); margin-top: 2px; }

/* ── Weight card ── */
.weight-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.weight-diff { font-weight: 700; font-size: 15px; }

/* ── List items ── */
.list-section { padding: 0 16px; }
.list-section-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-sec);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 16px 0 8px;
}
.meal-section-title { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.meal-section-title span:last-child { color:var(--text); font-size:12px; letter-spacing:0; text-transform:none; font-variant-numeric:tabular-nums; white-space:nowrap; }
.list-item {
  display: flex;
  cursor: pointer;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  background: var(--card);
  border-radius: var(--radius-sm);
  margin-bottom: 6px;
}
.list-item-info { flex: 1; min-width: 0; }
.list-item-name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-item-meta { font-size: 12px; color: var(--text-sec); margin-top: 2px; }
.list-item-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; margin-left: 12px; }
.list-item-val { font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }

.del-btn {
  background: none; border: none; color: var(--red); cursor: pointer;
  padding: 6px; font-size: 16px; opacity: 0.7;
}
.del-btn:active { opacity: 1; }

/* ── Summary bar ── */
.summary-bar {
  display: flex;
  padding: 12px 16px;
  background: var(--card);
  border-radius: var(--radius-sm);
  margin: 0 16px 8px;
}
.summary-cell { flex: 1; text-align: center; }
.summary-val { font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
.summary-label { font-size: 10px; color: var(--text-sec); margin-top: 2px; }

/* ── Segment picker ── */
.seg-picker {
  display: flex;
  background: var(--card-alt);
  border-radius: 10px;
  padding: 3px;
  margin: 8px 16px 12px;
}
.seg-btn {
  flex: 1;
  padding: 8px;
  border: none;
  background: none;
  color: var(--text-sec);
  font: 600 13px/1 'Plus Jakarta Sans', sans-serif;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
}
.seg-btn.active {
  background: var(--card);
  color: var(--text);
}

/* ── Progress bars ── */
.progress-item { margin-bottom: 14px; }
.progress-header { display: flex; justify-content: space-between; margin-bottom: 6px; }
.progress-title { font-weight: 600; font-size: 14px; }
.progress-vals { font-size: 12px; color: var(--text-sec); font-variant-numeric: tabular-nums; }
.progress-track {
  height: 8px;
  background: var(--ring-track);
  border-radius: 4px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.5s ease;
}

/* ── Summary cards in progress ── */
.summary-card-row { display: flex; gap: 12px; }
.summary-card-item { flex: 1; }
.summary-card-label { font-size: 12px; color: var(--text-sec); }
.summary-card-val { font-size: 22px; font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; }
.summary-card-unit { font-size: 12px; color: var(--text-sec); margin-top: 1px; }

/* ── Forms ── */
.form-group {
  padding: 0 20px;
}
.form-section-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-sec);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 20px 0 8px;
}
.form-field {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  background: var(--card);
  border-radius: var(--radius-sm);
  margin-bottom: 6px;
}
.form-label { font-size: 15px; font-weight: 500; flex-shrink: 0; }
.form-input {
  background: none;
  border: none;
  color: var(--text);
  font: 500 15px 'Plus Jakarta Sans', sans-serif;
  text-align: right;
  width: 120px;
  outline: none;
  font-variant-numeric: tabular-nums;
}
.form-input::placeholder { color: var(--text-sec); }

.form-input-full {
  width: 100%;
  padding: 14px 16px;
  background: var(--card);
  border-radius: var(--radius-sm);
  border: none;
  color: var(--text);
  font: 500 15px 'Plus Jakarta Sans', sans-serif;
  outline: none;
  margin-bottom: 6px;
}
.form-input-full::placeholder { color: var(--text-sec); }

.form-select {
  background: none;
  border: none;
  color: var(--blue);
  font: 500 15px 'Plus Jakarta Sans', sans-serif;
  text-align: right;
  cursor: pointer;
  outline: none;
  -webkit-appearance: none;
  padding-right: 4px;
}
.form-select option { background: var(--card); color: var(--text); }

/* ── Stepper ── */
.stepper {
  display: flex;
  align-items: center;
  gap: 12px;
}
.stepper-btn {
  width: 32px; height: 32px;
  border-radius: 50%;
  border: none;
  background: var(--card-alt);
  color: var(--blue);
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.stepper-btn:active { background: var(--blue); color: var(--text); }
.stepper-val { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 28px; text-align: center; }

/* ── Modal ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
.modal-overlay.active { opacity: 1; pointer-events: auto; }

.modal-sheet {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%) translateY(100%);
  width: 100%;
  max-width: 430px;
  background: var(--bg);
  border-radius: 24px 24px 0 0;
  max-height: 90dvh;
  overflow-y: auto;
  transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
  z-index: 101;
  padding-bottom: calc(20px + var(--safe-b));
}
.modal-overlay.active .modal-sheet { transform: translateX(-50%) translateY(0); }

.modal-handle {
  width: 36px;
  height: 5px;
  background: rgba(255,255,255,0.2);
  border-radius: 3px;
  margin: 10px auto 0;
}
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
}
.modal-title { font-size: 18px; font-weight: 700; }
.modal-btn {
  background: none;
  border: none;
  font: 600 15px 'Plus Jakarta Sans', sans-serif;
  cursor: pointer;
  padding: 6px 2px;
}
.modal-cancel { color: var(--text-sec); }
.modal-save { color: var(--blue); }
.modal-save:disabled { color: var(--text-sec); opacity: 0.5; }

/* ── Pill picker (meal selector) ── */
.pill-row { display: flex; gap: 8px; padding: 0 20px 8px; overflow-x: auto; }
.pill-btn {
  padding: 8px 16px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: none;
  color: var(--text-sec);
  font: 500 13px 'Plus Jakarta Sans', sans-serif;
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.2s;
}
.pill-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; }

/* ── Empty state ── */
.empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-sec);
}
.empty-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.4; }
.empty-text { font-size: 14px; }

/* ── FAB ── */
.fab {
  position: fixed;
  bottom: calc(var(--tab-h) + var(--safe-b) + 16px);
  right: max(16px, calc((100% - 430px)/2 + 16px));
  width: 52px;
  height: 52px;
  border-radius: 50%;
  border: none;
  background: var(--blue);
  color: #fff;
  font-size: 28px;
  font-weight: 300;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(26,140,255,0.35);
  z-index: 40;
  transition: transform 0.15s;
}
.fab:active { transform: scale(0.92); }

/* ── Animations ── */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.animate-in { animation: fadeIn 0.3s ease both; }

/* ── Calorie ring center ── */
.cal-ring-center {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}
.cal-ring-value { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; }
.cal-ring-target { font-size: 13px; color: var(--text-sec); }
.cal-ring-left { font-size: 12px; color: var(--green); font-weight: 600; margin-top: 2px; }

.cal-ring-wrap {
  position: relative;
  width: 190px;
  height: 190px;
  margin: 4px auto 12px;
}

/* ── Date navigator ── */
.date-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 16px 12px;
}
.date-nav-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: none;
  background: var(--card);
  color: var(--text);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.date-nav-btn:active { background: var(--blue); }
.date-nav-btn:disabled { opacity: 0.25; pointer-events: none; }
.date-nav-center {
  text-align: center; cursor: pointer; position: relative;
  border: none; background: transparent; color: inherit; padding: 4px 12px;
  font: inherit; min-width: 150px;
}
.date-nav-label { font-weight: 700; font-size: 16px; }
.date-nav-sub { font-size: 11px; color: var(--text-sec); margin-top: 1px; }
.date-nav-center:active { opacity: .75; }
.food-calendar {
  margin: -4px 16px 12px; padding: 12px; background: var(--card);
  border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: 0 12px 30px rgba(0,0,0,.22);
}
.food-calendar-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.food-calendar-title { font-size:14px; font-weight:800; }
.food-calendar-nav {
  width:32px; height:32px; border:0; border-radius:50%; background:var(--card-alt);
  color:var(--text); cursor:pointer; font-size:18px; line-height:1;
}
.food-calendar-nav:disabled { opacity:.25; cursor:default; }
.food-calendar-week, .food-calendar-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
.food-calendar-week { margin-bottom:4px; }
.food-calendar-week div { text-align:center; color:var(--text-sec); font-size:9px; font-weight:700; padding:3px 0; }
.food-calendar-day {
  border:0; background:transparent; color:var(--text); min-height:34px; border-radius:9px;
  font:600 12px 'Plus Jakarta Sans',sans-serif; cursor:pointer;
}
.food-calendar-day:hover:not(:disabled) { background:var(--card-alt); }
.food-calendar-day.selected { background:var(--blue); color:#fff; }
.food-calendar-day.today:not(.selected) { box-shadow:inset 0 0 0 1px var(--blue); }
.food-calendar-day:disabled { color:var(--text-sec); opacity:.22; cursor:default; }

/* ── Date field in modal ── */
.date-field {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  background: var(--card);
  border-radius: var(--radius-sm);
  margin: 0 20px 8px;
}
.date-field-label { font-size: 15px; font-weight: 500; }
.date-field-input {
  background: none;
  border: none;
  color: var(--blue);
  font: 500 15px 'Plus Jakarta Sans', sans-serif;
  outline: none;
  -webkit-appearance: none;
  text-align: right;
}

/* ── Workout icon ── */
.wo-icon {
  width: 40px; height: 40px;
  border-radius: 10px;
  background: rgba(255,158,38,0.12);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  color: var(--orange);
  flex-shrink: 0;
  margin-right: 12px;
}

.app-loading-overlay{position:fixed;inset:0;z-index:9000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;opacity:1;visibility:visible;transition:opacity .28s ease,visibility .28s ease;}
.app-loading-overlay.hidden{opacity:0;visibility:hidden;pointer-events:none;}
.app-loading-box{width:min(100%,300px);text-align:center;}
.app-loading-spinner{width:34px;height:34px;border:3px solid rgba(255,255,255,.10);border-top-color:var(--blue);border-radius:50%;margin:0 auto 14px;animation:appSpin .8s linear infinite;}
.app-loading-title{font-size:15px;font-weight:700;}
.app-loading-sub{font-size:11px;color:var(--text-sec);margin-top:5px;}
@keyframes appSpin{to{transform:rotate(360deg);}}

.daily-quote{min-height:20px;transition:opacity .32s ease,transform .32s ease;}
.daily-quote.is-loading{opacity:.72;}
.daily-quote.is-updating{opacity:0;transform:translateY(4px);}
.daily-quote.is-ready{opacity:1;transform:translateY(0);}
.auth-overlay{position:fixed;inset:0;z-index:10000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;}
.auth-box{width:min(100%,390px);background:var(--card);border:1px solid var(--border);border-radius:22px;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.35);}
.auth-logo{font-size:28px;font-weight:800;margin-bottom:0;text-align:center;}
.auth-byline{font-size:11px;color:var(--text-sec);margin:2px 0 6px;text-align:center;}
.auth-sub{color:var(--text-sec);font-size:13px;margin-bottom:22px;}
.auth-input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--text);outline:none;margin-bottom:10px;font-size:16px;}
.auth-btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--blue);color:white;font-weight:800;font-size:15px;margin-top:4px;}
.auth-secondary{width:100%;padding:12px;border:0;background:transparent;color:var(--text-sec);font-weight:700;font-size:13px;}
.auth-msg{font-size:12px;color:var(--orange);min-height:18px;margin:4px 0 8px;}
.logout-btn{width:100%;padding:14px;border:1px solid rgba(255,92,92,.35);border-radius:12px;background:rgba(255,92,92,.08);color:#ff7b7b;font-weight:800;font-size:14px;margin-top:12px;cursor:pointer;}
.profile-save-confirm{height:0;overflow:hidden;text-align:center;color:var(--green);font-size:11px;font-weight:700;opacity:0;transform:translateY(-4px);transition:opacity .28s ease,transform .28s ease;height:18px;margin-top:6px;}
.profile-save-confirm.show{opacity:1;transform:translateY(0);}

/* ── Food / weight additions ── */
.food-day-card { margin-bottom: 8px; }
.food-day-rings { display:flex; justify-content:space-around; align-items:center; gap:10px; }
.food-day-ring { flex:1; text-align:center; }
.food-day-ring-title { font-size:12px; color:var(--text-sec); margin-top:2px; }
.food-day-ring-value { font-size:18px; font-weight:800; margin-top:2px; }
.food-day-ring-sub { font-size:11px; color:var(--text-sec); }
.food-select-wrap { margin-bottom:8px; }

function dbBodyPartName(part){return normalizeWorkoutBodyPart(part)==='Leg'?'Legs':normalizeWorkoutBodyPart(part);}

// Legacy compatibility: older versions stored workout time/calories on workout_entries.
// The migration may create zero-valued workout_sessions for those dates, so fall back
// to the entry totals only when the normalized session has no totals of its own.
function workoutSessionTotals(session) {
  const entries = store.workouts.filter(w =>
    (w.sessionId === session.id) || (!w.sessionId && toDateStr(new Date(w.date)) === session.date)
  );
  const entryMinutes = entries.reduce((sum,w)=>sum+n(w.minutes),0);
  const entryKcal = entries.reduce((sum,w)=>sum+n(w.kcal),0);
  return {
    minutes: n(session.minutes) || entryMinutes,
    kcal: n(session.kcal) || entryKcal
  };
}

      fiberPer100g: n(entry.fiberPer100g),
      caloriesPerCount: n(entry.caloriesPerCount),

      carbsPerCount: n(entry.carbsPerCount),
      fatPerCount: n(entry.fatPerCount),
      fiberPerCount: n(entry.fiberPerCount)
    };
    this.foodLibrary = this.foodLibrary.filter(f => f.name.trim().toLowerCase() !== item.name.toLowerCase());
    this.foodLibrary.unshift(item);
    this.save();
    this.syncFoodDefinition(item);

  updateFoodDefinition(id, patch) {
    const idx = this.foodLibrary.findIndex(f => f.id === id);
    if (idx < 0) return;
    const old = this.foodLibrary[idx];
    const item = { ...old, ...patch, id };
    this.foodLibrary[idx] = item;

    // Recalculate every historical log linked to this food definition so
    // changing the library nutrition updates the full history consistently.
    this.foods = this.foods.map(entry => {
      if (entry.foodId !== id) return entry;
      const qty = n(entry.quantity);
      const out = foodDefNutrition(item, qty);
      return { ...entry, name:item.name, unit:out.unit, totalGrams:out.grams, nutritionBasis:item.basis,
        kcal:out.kcal, protein:out.protein, carbs:out.carbs, fat:out.fat, fiber:out.fiber };
    });
    this.save();
    this.syncFoodDefinition(item);
    this.foods.filter(f => f.foodId === id).forEach(f => this.syncFood(f));
  },

  updateFood(id, patch) {
    const idx = this.foods.findIndex(f => f.id === id);

    this.weights.sort((a,b) => new Date(b.date) - new Date(a.date));

  save() {

// ── Helpers ──
function uid() { return crypto.randomUUID(); }
function isToday(d) { const t = new Date(), dd = new Date(d); return t.toDateString() === dd.toDateString(); }
function clamp(v, lo, hi) { return Math.min(Math.max(v, lo), hi); }
function r(v) {
  const x = Number(v);
  if (!Number.isFinite(x)) return 0;
  return Number.isInteger(x) ? x : Number(x.toFixed(2));
}
function n(v, fallback=0) {
  const x = Number(v);
  return Number.isFinite(x) ? x : fallback;
}

function calculateAge(dateOfBirth) {
  if (!dateOfBirth) return 0;
  const dob = new Date(dateOfBirth + 'T00:00:00');
  if (Number.isNaN(dob.getTime())) return 0;
  const today = new Date();
  let age = today.getFullYear() - dob.getFullYear();
  const monthDiff = today.getMonth() - dob.getMonth();
  if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < dob.getDate())) age--;
  return Math.max(0, age);
}

function greeting() {
  const h = new Date().getHours();
  const t = h < 12 ? 'Morning' : h < 17 ? 'Afternoon' : 'Evening';
  const e = h < 12 ? '☀️' : h < 17 ? '🌤️' : '🌙';
  const n = store.profile.name || 'there';
  return `Good ${t}, ${n} ${e}`;
}

function ringSVG(value, total, color, size, label) {
  const sw = size > 100 ? 14 : 6;
  const rad = (size - sw) / 2;
  const circ = 2 * Math.PI * rad;
  const rawPercent = total > 0 ? (value / total) * 100 : 0;
  const p = clamp(rawPercent / 100, 0, 1);
  const off = circ * (1 - p);
  const displayPercent = rawPercent >= 100 ? Math.round(rawPercent) : r(rawPercent);
  const cx = size/2, cy = size/2;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${cx}" cy="${cy}" r="${rad}" fill="none" stroke="var(--ring-track)" stroke-width="${sw}"/>
    <circle cx="${cx}" cy="${cy}" r="${rad}" fill="none" stroke="${color}" stroke-width="${sw}"
      stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${off}"
      transform="rotate(-90 ${cx} ${cy})" style="transition:stroke-dashoffset .6s ease"/>
    ${label ? `<text x="${cx}" y="${cy-5}" text-anchor="middle" fill="var(--text)" font-size="14" font-weight="700" font-family="Plus Jakarta Sans,sans-serif">${r(value)}</text>
    <text x="${cx}" y="${cy+10}" text-anchor="middle" fill="var(--text-sec)" font-size="9" font-family="Plus Jakarta Sans,sans-serif">${label}</text>
    <text x="${cx}" y="${cy+24}" text-anchor="middle" fill="${color}" font-size="9" font-weight="700" font-family="Plus Jakarta Sans,sans-serif">${displayPercent}%</text>` : ''}
  </svg>`;
}

function calRingSVG() {
  const val = store.todayKcal, tot = store.profile.calorieTarget;
  const size = 190, sw = 14, rad = (size-sw)/2;
  const circ = 2 * Math.PI * rad;
  const p = clamp(tot > 0 ? val / tot : 0, 0, 1);
  const off = circ * (1 - p);
  const cx = size/2;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="var(--blue)"/><stop offset="1" stop-color="var(--green)"/></linearGradient></defs>
    <circle cx="${cx}" cy="${cx}" r="${rad}" fill="none" stroke="var(--ring-track)" stroke-width="${sw}"/>
    <circle cx="${cx}" cy="${cx}" r="${rad}" fill="none" stroke="url(#cg)" stroke-width="${sw}"
      stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${off}"
      transform="rotate(-90 ${cx} ${cx})" style="transition:stroke-dashoffset .6s ease"/>
  </svg>`;
}

function woIcon(type) {
  const t = type.toLowerCase();
  if (t.includes('run') || t.includes('walk')) return '🏃';
  if (t.includes('cycl')) return '🚴';
  if (t.includes('swim')) return '🏊';
  if (t.includes('yoga')) return '🧘';
  if (t.includes('hiit')) return '⚡';
  if (t.includes('sport')) return '⚽';
  return '🏋️';
}

function isSameDay(d1, d2) { return new Date(d1).toDateString() === new Date(d2).toDateString(); }

function foodsForDate(date) { return store.foods.filter(f => isSameDay(f.date, date)); }
function kcalForDate(date) { return foodsForDate(date).reduce((s,f) => s+f.kcal, 0); }
function proteinForDate(date) { return foodsForDate(date).reduce((s,f) => s+f.protein, 0); }
function carbsForDate(date) { return foodsForDate(date).reduce((s,f) => s+f.carbs, 0); }
function fatForDate(date) { return foodsForDate(date).reduce((s,f) => s+f.fat, 0); }

function toDateStr(d) { const dd = new Date(d); return `${dd.getFullYear()}-${String(dd.getMonth()+1).padStart(2,'0')}-${String(dd.getDate()).padStart(2,'0')}`; }
function toDisplayDate(d) {
  const dd = new Date(d);
  const today = new Date(); today.setHours(0,0,0,0);
  const yesterday = new Date(today); yesterday.setDate(yesterday.getDate()-1);
  if (dd.toDateString() === today.toDateString()) return 'Today';
  if (dd.toDateString() === yesterday.toDateString()) return 'Yesterday';
  return dd.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
}
function toFullDate(d) {
  return new Date(d).toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric', year:'numeric' });
}
function shiftDate(d, days) {
  const dd = new Date(d);
  dd.setDate(dd.getDate() + days);
  return dd;
}

function startOfWeek(d) {
  const x = new Date(d); x.setHours(0,0,0,0);
  const day = x.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  x.setDate(x.getDate() + diff);
  return x;
}
function startOfMonth(d) {
  const x = new Date(d); x.setHours(0,0,0,0);
  x.setDate(1);
  return x;
}
function periodData(period) {
  const now = new Date(); now.setHours(0,0,0,0);
  let start, elapsedDays;
  if (period === 'day') { start = new Date(now); elapsedDays = 1; }
  else if (period === 'week') { start = startOfWeek(now); elapsedDays = Math.floor((now-start)/86400000)+1; }
  else { start = startOfMonth(now); elapsedDays = Math.floor((now-start)/86400000)+1; }
  const end = new Date(now); end.setHours(23,59,59,999);
  const inRange = (d) => { const x = new Date(d); return x >= start && x <= end; };
  const foods = store.foods.filter(f => inRange(f.date));
  const workouts = store.workouts.filter(w => inRange(w.date));
  return { start, end, elapsedDays, foods, workouts,
    kcal: foods.reduce((s,f)=>s+f.kcal,0), protein: foods.reduce((s,f)=>s+f.protein,0),
    carbs: foods.reduce((s,f)=>s+f.carbs,0), fat: foods.reduce((s,f)=>s+f.fat,0), fiber: foods.reduce((s,f)=>s+f.fiber,0),
    burn: (()=>{const sessions=store.workoutSessions.filter(x=>inRange(x.date));const sessionDates=new Set(sessions.map(x=>x.date));const legacy=workouts.filter(w=>!w.sessionId&&!sessionDates.has(toDateStr(new Date(w.date))));return sessions.reduce((a,x)=>a+workoutSessionTotals(x).kcal,0)+legacy.reduce((a,w)=>a+n(w.kcal),0);})() };
}

// ── Daily gym quote ──
const DAILY_QUOTE_FUNCTION = 'kcalTracker_qoutes';
const DAILY_QUOTE_FALLBACK = 'Stay consistent. Progress takes time. 💪';
const DAILY_QUOTE_URL = `${SUPABASE_URL}/functions/v1/${DAILY_QUOTE_FUNCTION}`;
let dailyQuoteText = DAILY_QUOTE_FALLBACK;
let dailyQuoteLoadedDate = '';
let dailyQuoteRequestStarted = false;

function localDateKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

async function invokeDailyQuoteDirect() {
  // Call the deployed Supabase Edge Function through supabase-js.
  // supabase-js automatically sends the project's publishable key and,
  // when the user is signed in, the current Supabase Auth session token.
  const { data, error } = await sb.functions.invoke(DAILY_QUOTE_FUNCTION, {
    body: {}
  });

  if (error) {
    let detail = error.message || String(error);
    try {
      if (error.context) {
        const body = await error.context.json();
        detail = body?.error || body?.message || detail;
      }
    } catch (_) {}
    throw new Error(`Daily quote function failed: ${detail}`);
  }

  if (!data || typeof data !== 'object') {
    throw new Error('Daily quote function returned an invalid response');
  }

  return data;
}

async function loadDailyQuote(force = false) {
  const todayKey = localDateKey();
  if (!force && (dailyQuoteRequestStarted || dailyQuoteLoadedDate === todayKey)) return;
  dailyQuoteRequestStarted = true;
  console.info('[Daily Quote] Starting fetch for', todayKey);

  try {
    let data = null;
    let lastError = null;

    // Retry the actual Edge Function request. A temporary Gemini 503/timeout
    // should not prevent the app from trying again during the same page load.
    for (let attempt = 1; attempt <= 3; attempt++) {
      try {
        console.info(`[Daily Quote] Attempt ${attempt}/3 -> ${DAILY_QUOTE_FUNCTION}`);
        data = await invokeDailyQuoteDirect();
        console.info('[Daily Quote] Edge Function response:', data);
        break;
      } catch (e) {
        lastError = e;
        console.warn(`[Daily Quote] Attempt ${attempt} failed:`, e?.message || e);
        if (attempt < 3) await new Promise(resolve => setTimeout(resolve, attempt * 1500));
      }
    }

    if (!data) throw lastError || new Error('Daily quote function failed');

    const quote = typeof data?.quote === 'string' ? data.quote.trim() : '';
    if (!quote) throw new Error('No quote returned by Edge Function');

    dailyQuoteText = quote;
    dailyQuoteLoadedDate = todayKey;
    console.info('[Daily Quote] Loaded successfully:', {
      date: data?.date || todayKey,
      source: data?.source || 'unknown',
      quote
    });

    // The Home view may have been replaced while the function was running.
    const el = document.getElementById('daily-quote');
    if (!el) return;

    el.classList.remove('is-ready');
    el.classList.add('is-updating');

    setTimeout(() => {
      const current = document.getElementById('daily-quote');
      if (!current) return;
      current.textContent = quote;
      current.classList.remove('is-loading', 'is-updating');
      current.classList.add('is-ready');
    }, 180);
  } catch (error) {
    console.error('[Daily Quote] Final failure — keeping fallback:', error?.message || error);
    const el = document.getElementById('daily-quote');
    if (el) {
      dailyQuoteText = DAILY_QUOTE_FALLBACK;
      el.textContent = DAILY_QUOTE_FALLBACK;
      el.classList.remove('is-updating', 'is-loading');
      el.classList.add('is-ready');
    }
  } finally {
    dailyQuoteRequestStarted = false;
  }
}

// If the app stays open across midnight, fetch the new day's quote when it
// becomes visible again. This does not block the main data-loading screen.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') loadDailyQuote();
});

function renderTabBar() {
  $tabbar.innerHTML = TABS.map((t,i) =>
    `<button type="button" class="tab-btn${i===currentTab?' active':''}" data-tab="${i}">${t.icon}<span>${t.label}</span></button>`
  ).join('');

  // Bind navigation directly to the buttons as well as the existing

  $tabbar.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => switchTab(parseInt(btn.dataset.tab, 10)));

function switchTab(i) {
  if (i === currentTab && $content.scrollTop === 0) return;
  if (currentTab === 5 && i !== 5) {
    profileDraft = null;
    profileSaveMessage = '';
  }
  // Workout summaries return to the default latest-three list whenever the tab is reopened.
  if (i === 2 && currentTab !== 2) workoutSummaryDate = '';
  if (currentTab === 2 && i !== 2) workoutSummaryDate = '';
  // Food opens on today every time you return to the Food tab.
  if (i === 1 && currentTab !== 1) {
    foodViewDate = new Date();
    foodViewDate.setHours(0,0,0,0);
    foodCalendarOpen = false;
    foodCalendarMonth = new Date(foodViewDate.getFullYear(), foodViewDate.getMonth(), 1);
  }
  currentTab = i;
  renderTabBar();
  renderView();
  $content.scrollTop = 0;
}

function renderView() {
  const fab = document.querySelector('.fab');

  switch(currentTab) {
    case 0: renderHome(); break;
    case 1: renderFood(); break;
    case 2: renderWorkout(); break;
    case 3: renderProgress(); break;
    case 4: renderWeight(); break;

  const currentDate = new Date();
  const daysForTarget = isDay ? 1 : homePeriod === 'week' ? 7 : new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0).getDate();
  const calorieTarget = store.profile.calorieTarget * daysForTarget;
  const proteinTarget = store.profile.proteinTarget * daysForTarget;
  const carbTarget = store.profile.carbTarget * daysForTarget;
  const fatTarget = store.profile.fatTarget * daysForTarget;
  const fiberTarget = store.profile.fiberTarget * daysForTarget;
  const workoutTarget = isDay
    ? store.profile.workoutTarget
    : homePeriod === 'week'
      ? store.profile.workoutTarget * 4
      : store.profile.workoutTarget * (4 / 7) * daysForTarget;
  const calorieLeft = Math.max(0, r(calorieTarget - d.kcal));
  const workoutLeft = Math.max(0, r(workoutTarget - d.burn));
  const net = d.kcal - d.burn;
  const tab = `
    <div class="seg-picker" style="margin-top:8px">

function calRingSVGFor(val, tot) {
  const size=190, sw=14, rad=(size-sw)/2, circ=2*Math.PI*rad, p=clamp(tot>0?val/tot:0,0,1), off=circ*(1-p), cx=size/2;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <defs><linearGradient id="cg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="var(--blue)"/><stop offset="1" stop-color="var(--green)"/></linearGradient></defs>
    <circle cx="${cx}" cy="${cx}" r="${rad}" fill="none" stroke="var(--ring-track)" stroke-width="${sw}"/>
    <circle cx="${cx}" cy="${cx}" r="${rad}" fill="none" stroke="url(#cg2)" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${off}" transform="rotate(-90 ${cx} ${cx})"/>
  </svg>`;
}

// ── Food calendar ──
function startOfMonth(d) {
  const x = new Date(d);
  x.setDate(1); x.setHours(0,0,0,0);
  return x;
}
function sameMonth(a,b) {
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth();
}
function renderFoodCalendar() {
  const month = startOfMonth(foodCalendarMonth);
  const today = new Date(); today.setHours(0,0,0,0);
  const firstDay = new Date(month);
  // Monday-first calendar: Monday=0 ... Sunday=6.
  const offset = (firstDay.getDay() + 6) % 7;
  const daysInMonth = new Date(month.getFullYear(), month.getMonth()+1, 0).getDate();
  const prevMonth = new Date(month.getFullYear(), month.getMonth()-1, 1);
  const nextMonth = new Date(month.getFullYear(), month.getMonth()+1, 1);
  const canGoNext = nextMonth <= startOfMonth(today);
  const cells = [];
  for (let i=0; i<offset; i++) cells.push('<span></span>');
  for (let day=1; day<=daysInMonth; day++) {
    const date = new Date(month.getFullYear(), month.getMonth(), day);
    date.setHours(0,0,0,0);
    const future = date > today;
    const selected = isSameDay(date, foodViewDate);
    const classes = `food-calendar-day${selected?' selected':''}${isSameDay(date,today)?' today':''}`;
    cells.push(`<button type="button" class="${classes}" data-food-calendar-day="${toDateStr(date)}" ${future?'disabled':''}>${day}</button>`);
  }
  return `<div class="food-calendar" data-food-calendar role="dialog" aria-label="Select food log date">
    <div class="food-calendar-head">
      <button type="button" class="food-calendar-nav" data-food-calendar-nav="-1" aria-label="Previous month">‹</button>
      <div class="food-calendar-title">${month.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</div>
      <button type="button" class="food-calendar-nav" data-food-calendar-nav="1" aria-label="Next month" ${canGoNext?'':'disabled'}>›</button>
    </div>
    <div class="food-calendar-week"><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div></div>
    <div class="food-calendar-grid">${cells.join('')}</div>
  </div>`;
}
function toggleFoodCalendar() {
  foodCalendarOpen = !foodCalendarOpen;
  if (foodCalendarOpen) foodCalendarMonth = startOfMonth(foodViewDate);
  renderView();
}

reps).join(' / ')} reps</span><span class="exercise-chip">${(w.sets||[]).map(x=>x.weight).join(' / ')} kg</span>`}</div></div>`).join('')}</div>`).join('')||'<div class="exercise-meta" style="padding:8px 0">No exercises added to this date yet. Choose a body part below to add strength or cardio exercises.</div>'}</div>

// ── Progress View ──
function renderProgress() {
  const now = new Date(); now.setHours(0,0,0,0);
  let start, end, days, elapsedDays, workoutTarget;

  if (progressPeriod === 7) {
    // Calendar week: Monday through Sunday.
    start = startOfWeek(now);
    end = new Date(start);
    end.setDate(end.getDate() + 6);
    end.setHours(23,59,59,999);
    days = 7;
    elapsedDays = Math.floor((now - start) / 86400000) + 1;
    workoutTarget = store.profile.workoutTarget * 4;
  } else if (progressPeriod === 30) {
    // Calendar month: first through last day. Actuals are month-to-date.
    start = startOfMonth(now);
    end = new Date(now.getFullYear(), now.getMonth() + 1, 0);
    end.setHours(23,59,59,999);
    days = end.getDate();
    elapsedDays = Math.floor((now - start) / 86400000) + 1;
    workoutTarget = store.profile.workoutTarget * (4 / 7) * days;
  } else {
    // Rolling 90 days.
    start = new Date(now);
    start.setDate(start.getDate() - 89);
    end = new Date(now);
    end.setHours(23,59,59,999);
    days = 90;
    elapsedDays = 90;
    workoutTarget = store.profile.workoutTarget * (4 / 7) * days;
  }

  const inRange = (d) => { const x = new Date(d); return x >= start && x <= end; };
  const fs = store.foods.filter(f => inRange(f.date));
  const ws = store.workouts.filter(w => inRange(w.date));
  const divisor = Math.max(elapsedDays,1);
  const totP = fs.reduce((s,f)=>s+f.protein,0);
  const totC = fs.reduce((s,f)=>s+f.carbs,0);
  const totF = fs.reduce((s,f)=>s+f.fat,0);
  const totFi = fs.reduce((s,f)=>s+f.fiber,0);
  const totKcal = fs.reduce((s,f)=>s+f.kcal,0);
  const progressSessions=store.workoutSessions.filter(x=>inRange(x.date)); const progressSessionDates=new Set(progressSessions.map(x=>x.date)); const totBurn = progressSessions.reduce((a,x)=>a+workoutSessionTotals(x).kcal,0)+ws.filter(w=>!w.sessionId&&!progressSessionDates.has(toDateStr(new Date(w.date)))).reduce((a,w)=>a+n(w.kcal),0);
  const avgIn = totKcal / divisor;
  const avgBurn = totBurn / divisor;
  const avgP = totP / divisor;
  const avgC = totC / divisor;
  const avgF = totF / divisor;
  const avgFi = totFi / divisor;
  const avgWorkout = totBurn / divisor;

  function pbar(label, val, target, color) {
    const p = clamp(target > 0 ? val/target : 0, 0, 1);
    return `<div class="progress-item">
      <div class="progress-header"><span class="progress-title">${label}</span><span class="progress-vals">${r(val)} / ${r(target)}</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:${p*100}%;background:${color}"></div></div>
    </div>`;
  }

  $content.innerHTML = `
    <div class="view-header"><div class="view-title">Progress</div></div>
    <div class="seg-picker">
      <button class="seg-btn${days===7?' active':''}" data-period="7">Week</button>
      <button class="seg-btn${days===30?' active':''}" data-period="30">Month</button>
      <button class="seg-btn${days===90?' active':''}" data-period="90">3 Months</button>
    </div>
    <div class="cards animate-in">
      <div class="card">
        <div class="summary-card-row">
          <div class="summary-card-item"><div class="summary-card-label">Avg. Daily Intake</div><div class="summary-card-val">${r(avgIn)}</div><div class="summary-card-unit">kcal</div></div>
          <div class="summary-card-item"><div class="summary-card-label">Avg. Daily Burn</div><div class="summary-card-val">${r(avgBurn)}</div><div class="summary-card-unit">kcal</div></div>
        </div>
      </div>
      <div class="card">
        <div style="font-size:16px;font-weight:700;margin-bottom:10px">Daily Averages</div>
        <div class="progress-average-grid">
          <div class="progress-average-item"><div class="progress-average-label">Protein</div><div class="progress-average-value">${r(avgP)}g</div></div>
          <div class="progress-average-item"><div class="progress-average-label">Carbs</div><div class="progress-average-value">${r(avgC)}g</div></div>
          <div class="progress-average-item"><div class="progress-average-label">Fat</div><div class="progress-average-value">${r(avgF)}g</div></div>
          <div class="progress-average-item"><div class="progress-average-label">Fiber</div><div class="progress-average-value">${r(avgFi)}g</div></div>
          <div class="progress-average-item"><div class="progress-average-label">Workout</div><div class="progress-average-value">${r(avgWorkout)}</div></div>

let weightPeriod = 'weekly';

function weightBuckets(period) {
  const raw = store.weights
    .map(w => ({ date:new Date(w.date), weight:n(w.weight) }))
    .filter(x => Number.isFinite(x.weight) && !Number.isNaN(x.date.getTime()))
    .sort((a,b)=>a.date-b.date);

  const days = period === 'weekly' ? 7 : 30;
  const end = new Date(); end.setHours(0,0,0,0);
  const start = new Date(end); start.setDate(start.getDate() - (days - 1));
  const byDay = new Map();
  raw.forEach(x => {
    const day = new Date(x.date); day.setHours(0,0,0,0);
    if (day >= start && day <= end) byDay.set(toDateStr(day), x.weight);
  });

  // Return one slot for every calendar day. If there is no entry that day,
  // carry forward the most recent known weight so the selected 7/30-day
  // window is represented in full.
  let carry = null;
  const before = raw.filter(x => x.date < start).at(-1);
  if (before) carry = before.weight;
  const result = [];
  for (let i=0; i<days; i++) {
    const day = new Date(start); day.setDate(start.getDate()+i);
    const key = toDateStr(day);
    if (byDay.has(key)) carry = byDay.get(key);
    if (carry != null) result.push({date:day, weight:carry});
  }
  return result;
}

function weightChartSVG(series, period) {
  if (!series.length) return `<div class="empty" style="padding:24px 10px"><div class="empty-icon">⚖️</div><div class="empty-text">No weight entries for this period.<br>Tap + to add a weight.</div></div>`;

  const W = 340, H = 205, left = 42, right = 42, top = 14, bottom = 45;
  const values = series.map(s => s.weight);
  const minV = Math.min(...values), maxV = Math.max(...values);

  // Keep the Y-axis easy to read: use 10 kg boundaries instead of
  // dynamically generated ranges such as 83.2–86.2 kg.
  // For a range within 10 kg, show one clean 10 kg interval.
  let lo = Math.floor(minV / 10) * 10;
  let hi = Math.ceil(maxV / 10) * 10;
  if (hi - lo < 10) {
    const center = (minV + maxV) / 2;
    lo = Math.floor(center / 10) * 10;
    hi = lo + 10;
    if (minV < lo) {
      lo -= 10;
      hi -= 10;
    }
    if (maxV > hi) {
      hi += 10;
    }
  }
  const x = i => left + (series.length===1 ? (W-left-right)/2 : i*(W-left-right)/(series.length-1));
  const y = v => top + (hi-v)*(H-top-bottom)/(hi-lo);
  const chartPoints = series.map((s,i)=>({x:x(i), y:y(s.weight)}));
  const smoothPath = chartPoints.length < 3
    ? `M ${chartPoints.map(p => `${p.x} ${p.y}`).join(' L ')}`
    : chartPoints.reduce((path, p, i, arr) => {
        if (i === 0) return `M ${p.x} ${p.y}`;
        const p0 = arr[i-2] || arr[i-1];
        const p1 = arr[i-1];
        const p2 = arr[i];
        const p3 = arr[i+1] || arr[i];
        const cp1x = p1.x + (p2.x - p0.x) / 6;
        const cp1y = p1.y + (p2.y - p0.y) / 6;
        const cp2x = p2.x - (p3.x - p1.x) / 6;
        const cp2y = p2.y - (p3.y - p1.y) / 6;
        return `${path} C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${p2.x} ${p2.y}`;
      }, '');

  // Put a short month together with each selected day label so dates remain
  // understandable even when the range crosses from one month into another.

  // Keep the graph readable: four evenly spaced date labels.
  // 7-day view: first day, 3rd day, 5th day, current day.
  // 30-day view: first day, around 20 days before, around 10 days before, current day.
  const labelIndices = period === 'weekly'
    ? new Set([0, 2, 4, series.length - 1])
    : new Set([0, 10, 20, series.length - 1]);
  const labels = series.map((s,i)=> {
    if (!labelIndices.has(i)) return '';
    const txt = s.date.toLocaleDateString(undefined,{month:'short',day:'numeric'});
    const anchor = i === 0 ? 'start' : i === series.length - 1 ? 'end' : 'middle';
    return `<text x="${x(i)}" y="${H-11}" text-anchor="${anchor}" class="weight-chart-label">${txt}</text>`;
  }).join('');

  // No visible dots, but keep transparent hover targets so the date/weight
  // tooltip remains available when the user hovers/taps along the line.
  const hoverTargets = series.map((s,i)=>`<circle cx="${x(i)}" cy="${y(s.weight)}" r="9" fill="transparent" stroke="none"><title>${s.date.toLocaleDateString()} — ${r(s.weight)} kg</title></circle>`).join('');
  const yLabels = [hi,(hi+lo)/2,lo].map(v=>`<text x="4" y="${y(v)+3}" class="weight-chart-axis">${r(v)}</text>`).join('');
  const grid = [hi,(hi+lo)/2,lo].map(v=>`<line x1="${left}" y1="${y(v)}" x2="${W-right}" y2="${y(v)}" stroke="var(--border)" stroke-width="1"/>`).join('');

  return `<div class="weight-chart-wrap">
    <svg class="weight-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend">
      ${grid}${yLabels}
      <path d="${smoothPath}" fill="none" stroke="var(--blue)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      ${hoverTargets}${labels}
    </svg>
  </div>`;
}

async function saveProfileChanges() {
  if (!profileDraft) return;
  const btn = document.querySelector('[data-save-profile]');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  profileSaveMessage = '';
  try {
    store.profile = JSON.parse(JSON.stringify(profileDraft));
    if (store.profile.dateOfBirth) store.profile.age = calculateAge(store.profile.dateOfBirth);
    store.save();
    if (cloudUser) {
      await store.syncProfile();
    }
    profileSaveMessage = 'Saved ✓';
    if (btn) { btn.disabled = false; btn.textContent = 'Save Changes'; }
    renderProfile();
    const confirm = document.querySelector('[data-profile-save-confirm]');
    if (confirm) {
      requestAnimationFrame(() => confirm.classList.add('show'));
      setTimeout(() => {
        confirm.classList.remove('show');
        setTimeout(() => { if (confirm.isConnected) confirm.textContent = ''; }, 300);
        profileSaveMessage = '';
      }, 1700);
    }
  } catch (err) {
    profileSaveMessage = 'Could not save changes';
    if (btn) { btn.disabled = false; btn.textContent = 'Save Changes'; }
    renderProfile();
    console.warn('Profile save failed:', err);
  }
}

function foodDefNutrition(food, qty) {
  if (!food || qty <= 0) return { grams:null, kcal:0, protein:0, carbs:0, fat:0, fiber:0, unit: food?.basis === 'count' ? 'count' : 'g' };
  if (food.basis === 'count') {
    return {
      grams:null, unit:'count',
      kcal:qty * n(food.caloriesPerCount),
      protein:qty * n(food.proteinPerCount),
      carbs:qty * n(food.carbsPerCount),
      fat:qty * n(food.fatPerCount),
      fiber:qty * n(food.fiberPerCount)
    };
  }
  const factor = qty / 100;
  return {
    grams:qty, unit:'g',
    kcal:factor * n(food.caloriesPer100g),
    protein:factor * n(food.proteinPer100g),
    carbs:factor * n(food.carbsPer100g),
    fat:factor * n(food.fatPer100g),
    fiber:factor * n(food.fiberPer100g)
  };
}

  function chooseFood(id) {
    const food = options.find(f => f.id === id);
    selectedFoodIdState = food?.id || '';
    foodInput.value = food?.name || '';
    foodCombo.classList.remove('open');
    updateFoodCalculation();
  }

  function updateFoodCalculation() {
    const food = selectedFood();
    const qty = parseFloat(qtyInput.value) || 0;
    if (food?.basis === 'count') {
      qtyLabel.textContent = 'Count';
      qtyInput.step = '0.1';
      basisInfo.textContent = 'Nutrition is stored per 1 count. You can enter 0.5, 1, 2, etc.';
    } else if (food) {
      qtyLabel.textContent = 'Grams';
      qtyInput.step = '0.1';
      basisInfo.textContent = 'Nutrition is stored per 100 g.';
    } else {
      qtyLabel.textContent = 'Amount';
      basisInfo.textContent = '';
    }
    const generalBtn = document.getElementById('add-general-food');
    if (generalBtn) generalBtn.style.display = food ? 'none' : 'block';
    const out = foodDefNutrition(food, qty);
    document.getElementById('af-out-kcal').textContent = r(out.kcal);
    document.getElementById('af-out-p').textContent = r(out.protein) + 'g';
    document.getElementById('af-out-c').textContent = r(out.carbs) + 'g';
    document.getElementById('af-out-f').textContent = r(out.fat) + 'g';
    document.getElementById('af-out-fi').textContent = r(out.fiber) + 'g';
    if (saveBtn) saveBtn.disabled = !(food && qty > 0);
  }

  function openFoodDropdown() {
    if (!foodInput || foodInput.disabled) return;
    renderFoodOptions(foodInput.value, true);
  }

  if (foodInput) {
    foodInput.addEventListener('focus', () => {
      // Selecting the field opens the same dropdown; typing immediately filters it.
      renderFoodOptions(foodInput.value, true);
      requestAnimationFrame(() => foodInput.select());
    });
    foodInput.addEventListener('click', openFoodDropdown);
    foodInput.addEventListener('input', () => {
      selectedFoodIdState = '';
      renderFoodOptions(foodInput.value, true);
      updateFoodCalculation();
    });
  }

  foodList.addEventListener('click', e => {
    const option = e.target.closest('[data-food-option]');
    if (!option) return;
    chooseFood(option.dataset.foodOption);
  });

  document.addEventListener('click', function closeFoodDropdown(e) {
    if (foodCombo && !foodCombo.contains(e.target)) foodCombo.classList.remove('open');
  }, { once:false });

  if (qtyInput) {
    qtyInput.addEventListener('input', updateFoodCalculation);
    qtyInput.addEventListener('change', updateFoodCalculation);
    const qtyField = document.getElementById('af-qty-field');
    if (qtyField) {
      const focusQty = (e) => {
        if (e.target === qtyInput) return;
        e.preventDefault();
        qtyInput.focus();
        qtyInput.select();
      };
      qtyField.addEventListener('click', focusQty);
      qtyField.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          qtyInput.focus();
          qtyInput.select();
        }
      });
    }
  }
  document.getElementById('add-general-food').onclick = () => showAddGeneralFood(forDate || new Date(), meal);
  document.getElementById('add-food-definition').onclick = () => showAddFoodDefinition(forDate || new Date(), meal);
  const editDefBtn = document.getElementById('edit-food-definition');
  if (editDefBtn) {
    editDefBtn.onclick = () => {
      const food = selectedFood();
      if (food) showEditFoodDefinition(food, forDate || new Date(), meal);
    };
  }
  renderFoodOptions('', false);
  if (selectedFoodIdState) {
    const sf = selectedFood();
    foodInput.value = sf?.name || '';
  }
  updateFoodCalculation();

  if (saveBtn) saveBtn.onclick = () => {
    const food = selectedFood();
    const qty = parseFloat(qtyInput.value) || 0;
    if (!food || qty <= 0) return;
    const pickedDate = new Date(document.getElementById('af-date').value + 'T12:00:00');
    const out = foodDefNutrition(food, qty);
    const patch = {
      date:pickedDate.toISOString(), meal, name:food.name, quantity:qty, unit:out.unit, foodId:food.id,
      totalGrams:out.grams, nutritionBasis:food.basis,
      kcal:out.kcal, protein:out.protein, carbs:out.carbs, fat:out.fat, fiber:out.fiber
    };
    if (isEdit) store.updateFood(editEntry.id, patch);
    else store.addFood(patch, pickedDate);
    foodViewDate = new Date(pickedDate); foodViewDate.setHours(0,0,0,0);
    closeModal();
    renderView();
  };
}

    : ['efd-kcal-100','efd-protein-100','efd-carbs-100','efd-fat-100','efd-fiber-100'];
  const validate = () => {
    const ids = idsFor();

    document.getElementById('update-food-definition').disabled = !valid;
    return valid;
  };
  basis.onchange = () => { const c=basis.value==='count'; wf.style.display=c?'none':'block'; cf.style.display=c?'block':'none'; validate(); };
  $sheet.querySelectorAll('input').forEach(i => i.addEventListener('input', validate));
  validate();

  document.getElementById('update-food-definition').onclick = () => {
    if (!validate()) return;
    const basisVal = basis.value;

      name: document.getElementById('efd-name').value.trim(), basis:basisVal,
      caloriesPer100g:basisVal==='weight'?parseFloat(document.getElementById('efd-kcal-100').value):0,

      fiberPerCount:basisVal==='count'?parseFloat(document.getElementById('efd-fiber-count').value):0
    };
    store.updateFoodDefinition(food.id, patch);
    showAddFood(returnDate || new Date(), food.id, returnMeal);
  };
}

      fiberPer100g: isCount ? 0 : parseFloat(document.getElementById('fd-fiber-100').value),

      carbsPerCount: isCount ? parseFloat(document.getElementById('fd-carbs-count').value) : 0,
      fatPerCount: isCount ? parseFloat(document.getElementById('fd-fat-count').value) : 0,
      fiberPerCount: isCount ? parseFloat(document.getElementById('fd-fiber-count').value) : 0
    });
    showAddFood(returnDate || new Date(), item.id, returnMeal);
  };
  document.getElementById('fd-name').focus();
}

document.addEventListener('change', e => {

document.addEventListener('click', e => {
  if(e.target.closest('#save-session-summary')){const day=document.getElementById('session-date')?.value||toDateStr(new Date());let session=store.workoutSessions.find(x=>x.date===day);if(!session){session={id:uid(),date:day,minutes:0,kcal:0};store.workoutSessions.unshift(session);}session.minutes=Math.max(0,n(document.getElementById('session-minutes').value));session.kcal=Math.max(0,n(document.getElementById('session-kcal').value));store.save();store.syncWorkoutSession(session);showCloudStatus('Workout session saved ✓');renderWorkout();return;}
  if(e.target.closest('[data-open-menu]')){profileReturnTab=currentTab;profileDraft=null;currentTab=5;renderTabBar();renderProfile();$content.scrollTop=0;return;}
  if(e.target.closest('[data-close-menu]')){document.getElementById('app-menu').classList.remove('open');return;}
  if(e.target.closest('[data-menu-profile]')){document.getElementById('app-menu').classList.remove('open');profileReturnTab=currentTab;currentTab=5;renderTabBar();profileDraft=null;renderProfile();$content.scrollTop=0;return;}
  if(e.target.closest('[data-open-profile]')){profileDraft=null;renderProfile();return;}
  if(e.target.closest('[data-back-more]')){profileDraft=null;profileSaveMessage='';currentTab=profileReturnTab;renderTabBar();renderView();$content.scrollTop=0;return;}
  const sub=e.target.closest('[data-workout-subtab]');if(sub){workoutSubTab=sub.dataset.workoutSubtab;renderWorkout();return;}
  if(e.target.closest('[data-clear-workout-date]')){workoutSummaryDate='';renderWorkout();return;}
  const range=e.target.closest('[data-insight-range]');if(range){workoutInsightRange=range.dataset.insightRange;renderWorkout();return;}
  const deleteLibraryExercise=e.target.closest('[data-delete-library-exercise]');if(deleteLibraryExercise){e.preventDefault();e.stopPropagation();showDeleteLibraryExercise(deleteLibraryExercise.dataset.deleteLibraryExercise,deleteLibraryExercise.dataset.bodypart||selectedBodyPart,deleteLibraryExercise.dataset.exerciseId);return;}
  const editExercise=e.target.closest('[data-edit-exercise]');if(editExercise){e.preventDefault();e.stopPropagation();showEditExercise(editExercise.dataset.editExercise,editExercise.dataset.editEquipment,editExercise.dataset.bodypart||selectedBodyPart,editExercise.dataset.exerciseId);return;}
  const part=e.target.closest('[data-bodypart]');if(part){selectedBodyPart=part.dataset.bodypart;renderWorkout();return;}
  const ex=e.target.closest('[data-select-exercise]');if(ex){selectedExerciseId=ex.dataset.exerciseId||null;showStrengthWorkout(selectedBodyPart,ex.dataset.selectExercise,ex.dataset.equipment);return;}
  if(e.target.closest('[data-add-custom-exercise]')){showCustomExercise();return;}
  if(e.target.closest('[data-remove-set]')){const row=e.target.closest('.exercise-set-row');if(row){row.remove();const rows=[...document.querySelectorAll('#strength-sets .exercise-set-row')];rows.forEach((x,i)=>x.querySelector('span').textContent=i+1);}return;}
  const tab = e.target.closest('[data-tab]');
  if (tab) { switchTab(parseInt(tab.dataset.tab)); return; }

  const foodDateToggle = e.target.closest('[data-food-date-toggle]');
  if (foodDateToggle) { toggleFoodCalendar(); return; }

  const foodCalendarNav = e.target.closest('[data-food-calendar-nav]');
  if (foodCalendarNav) {
    const delta = parseInt(foodCalendarNav.dataset.foodCalendarNav, 10);
    const nextMonth = new Date(foodCalendarMonth.getFullYear(), foodCalendarMonth.getMonth()+delta, 1);
    const today = new Date(); today.setHours(0,0,0,0);
    if (delta < 0 || nextMonth <= startOfMonth(today)) {
      foodCalendarMonth = nextMonth;
      renderView();
    }
    return;
  }

  const foodCalendarDay = e.target.closest('[data-food-calendar-day]');
  if (foodCalendarDay && !foodCalendarDay.disabled) {
    const picked = new Date(foodCalendarDay.dataset.foodCalendarDay + 'T00:00:00');
    const today = new Date(); today.setHours(0,0,0,0);
    if (picked <= today) {
      foodViewDate = picked;
      foodCalendarOpen = false;
      renderView();
    }
    return;
  }

  if (foodCalendarOpen && !e.target.closest('[data-food-calendar]') && !e.target.closest('[data-food-date-toggle]')) {
    foodCalendarOpen = false;
    renderView();
    return;
  }

  const editFood = e.target.closest('[data-edit-food]');
  if (editFood) {
    const entry = store.foods.find(f => f.id === editFood.dataset.editFood);
    if (entry) {
      if (entry.foodId && store.foodLibrary.some(f => f.id === entry.foodId)) showAddFood(new Date(entry.date), entry.foodId, entry.meal || 'Breakfast', entry);
      else showEditFoodManual(entry);
    }
    return;
  }

  const delFood = e.target.closest('[data-del-food]');
  if (delFood) { showDeleteFoodConfirm(delFood.dataset.delFood); return; }

  const foodEntry = e.target.closest('[data-food-entry]');
  if (foodEntry) {
    const entry = store.foods.find(f => f.id === foodEntry.dataset.foodEntry);
    if (entry) {
      if (entry.foodId && store.foodLibrary.some(f => f.id === entry.foodId)) showAddFood(new Date(entry.date), entry.foodId, entry.meal || 'Breakfast', entry);
      else showEditFoodManual(entry);
    }
    return;
  }

  const editWo = e.target.closest('[data-edit-wo]');
  if (editWo) {
    const entry = store.workouts.find(w => w.id === editWo.dataset.editWo);
    if (entry) entry.bodyPart ? showStrengthWorkout(entry.bodyPart,entry.exercise,entry.equipment,entry) : showAddWorkout(new Date(entry.date), entry);
    return;
  }

  const delWo = e.target.closest('[data-del-wo]');
  if (delWo) { store.deleteWorkout(delWo.dataset.delWo); renderView(); return; }

  const addWorkoutDate = e.target.closest('[data-add-workout-date]');
  if (addWorkoutDate) {
    showAddWorkout(new Date(addWorkoutDate.dataset.addWorkoutDate + 'T12:00:00'));
    return;
  }

  const editWeight = e.target.closest('[data-edit-weight]');
  if (editWeight) {
    const entry = store.weights.find(w => w.id === editWeight.dataset.editWeight);
    if (entry) showEditWeight(entry);
    return;
  }

  const delWeight = e.target.closest('[data-del-weight]');
  if (delWeight) {
    showDeleteWeightConfirm(delWeight.dataset.delWeight);
    return;
  }

  const hp = e.target.closest('[data-home-period]');
  if (hp) { homePeriod = hp.dataset.homePeriod; renderView(); return; }

  const seg = e.target.closest('[data-period]');
  if (seg) { progressPeriod = parseInt(seg.dataset.period); renderView(); return; }

  const weightSeg = e.target.closest('[data-weight-period]');
  if (weightSeg) { weightPeriod = weightSeg.dataset.weightPeriod; renderView(); return; }

  const dateShift = e.target.closest('[data-date-shift]');
  if (dateShift) {
    const delta = parseInt(dateShift.dataset.dateShift);
    const nextDate = shiftDate(foodViewDate, delta);
    const today = new Date(); today.setHours(0,0,0,0);
    foodViewDate = nextDate > today ? today : nextDate;
    renderView();
    return;
  }

  const step = e.target.closest('[data-step]');
  if (step) {
    const [field, delta] = step.dataset.step.split(',');
    if (!profileDraft) profileDraft = JSON.parse(JSON.stringify(store.profile));
    profileDraft[field] = clamp(profileDraft[field] + parseInt(delta), 1, 120);
    profileSaveMessage = '';
    renderProfile();
    return;
  }

  const saveProfile = e.target.closest('[data-save-profile]');
  if (saveProfile) {
    saveProfileChanges();
    return;
  }
});

// ── PWA Manifest (inline) ──
function setupPWA() {
  const manifest = {
    name: 'KcalTrack',
    short_name: 'KcalTrack',
    display: 'standalone',
    background_color: '#091321',
    theme_color: '#091321',
    start_url: '.',
    scope: '.'
  };
  const blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = URL.createObjectURL(blob);
  document.head.appendChild(link);

  // Generate app icon
  try {
    const c = document.createElement('canvas');
    c.width = c.height = 180;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#091321';
    ctx.beginPath();
    ctx.roundRect(0, 0, 180, 180, 36);
    ctx.fill();
    ctx.strokeStyle = '#1A8CFF';
    ctx.lineWidth = 7;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(90, 78, 36, -Math.PI*0.5, Math.PI*0.75);
    ctx.stroke();
    ctx.fillStyle = '#F0F2F5';
    ctx.font = '800 40px Plus Jakarta Sans, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('K', 90, 80);
    ctx.fillStyle = '#7A8BA3';
    ctx.font = '600 13px Plus Jakarta Sans, sans-serif';
    ctx.fillText('kcal', 90, 140);
    const iconLink = document.createElement('link');
    iconLink.rel = 'apple-touch-icon';
    iconLink.href = c.toDataURL('image/png');
    document.head.appendChild(iconLink);
  } catch(e) {}
}

// ── Supabase cloud sync ──
async function connectCloud() {
  console.info('[KcalTrack] connectCloud() started');
  showInitialDataLoading();

  let session = null;
  try {
    const result = await sb.auth.getSession();
    session = result?.data?.session || null;
    console.info('[KcalTrack] Existing Supabase session:', !!session, session?.user?.id || 'none');
  } catch (e) {
    console.error('[KcalTrack] getSession() failed:', e);
  }

  // The daily quote is independent of the food/workout cloud sync.
  loadDailyQuote(true);

  if (!session) {
    resetStoreForAccount();
    renderView();
    hideInitialDataLoading();
    showAuthOverlay();
    return;
  }

  resetStoreForAccount();
  cloudUser = session.user;
  cloudReady = true;
  await syncFromCloud();
}

function showAuthOverlay(){
  const el=document.getElementById('auth-overlay');
  el.style.display='flex';
  const msg=document.getElementById('auth-msg');
  const finishLogin = async (user) => {
    // Never retain the previous account's in-memory data during account switch.
    resetStoreForAccount();
    cloudUser = user;
    cloudReady = true;
    cloudSyncing = false;
    showInitialDataLoading();
    try {
      await syncFromCloud();
      el.style.display='none';
      await loadDailyQuote(true);
    } catch (e) {
      msg.textContent = 'Could not load your cloud data. Please try again.';
      console.error('[KcalTrack] Login data load failed:', e);
    }
  };

  document.getElementById('auth-signin').onclick=async()=>{
    msg.textContent='Signing in…';
    const email=document.getElementById('auth-email').value.trim();
    const password=document.getElementById('auth-password').value;
    const {data,error}=await sb.auth.signInWithPassword({email,password});
    if(error){msg.textContent=error.message;return;}
    await finishLogin(data.user);
  };
  document.getElementById('auth-signup').onclick=async()=>{
    msg.textContent='Creating account…';
    const email=document.getElementById('auth-email').value.trim();
    const password=document.getElementById('auth-password').value;
    if(password.length<6){msg.textContent='Password must be at least 6 characters.';return;}
    const {data,error}=await sb.auth.signUp({email,password});
    if(error){msg.textContent=error.message;return;}
    if(data.session && data.user) await finishLogin(data.user);
    else msg.textContent='Account created. Check your email to confirm, then sign in.';
  };
}

async function syncFromCloud() {
  if (!cloudUser) return;
  const loadingUserId = cloudUser.id;
  cloudSyncing = true;
  try {
    const [pRes, fRes, wRes, wtRes, flRes, wsRes, setRes, bpRes, exRes, prefRes] = await Promise.all([
      sb.from('profiles').select('*').eq('id', loadingUserId).maybeSingle(),
      sb.from('food_entries').select('*').eq('user_id', loadingUserId).order('created_at', {ascending:false}),
      sb.from('workout_entries').select('*').eq('user_id', loadingUserId).order('created_at', {ascending:false}),
      sb.from('weight_entries').select('*').eq('user_id', loadingUserId).order('date', {ascending:false}),
      sb.from('food_library').select('*').eq('user_id', loadingUserId).order('name', {ascending:true}),
      sb.from('workout_sessions').select('*').eq('user_id', loadingUserId).order('date',{ascending:false}),
      sb.from('workout_sets').select('*,workout_entries!inner(user_id)').eq('workout_entries.user_id',loadingUserId),
      sb.from('workout_body_parts').select('id,name,display_order,is_active').eq('is_active',true).order('display_order'),
      sb.from('workout_exercises').select('id,body_part_id,user_id,name,equipment,is_active,is_default').eq('is_active',true),
      sb.from('workout_exercise_preferences').select('*').eq('user_id',loadingUserId)
    ]);
    if (cloudUser?.id !== loadingUserId) throw new Error('Account changed while loading data.');
    if (pRes.error) throw pRes.error;
    if (fRes.error) throw fRes.error;
    if (wRes.error) throw wRes.error;
    if (wtRes.error) throw wtRes.error;
    if (flRes.error) throw flRes.error;
    if (wsRes.error) throw wsRes.error;
    if (setRes.error) throw setRes.error;
    if (bpRes.error) throw bpRes.error;
    if (exRes.error) throw exRes.error;
    if (prefRes.error) throw prefRes.error;

    // Cloud is the source of truth. An empty result means an empty collection;
    // never upload legacy browser-local data into this account.
    // The database is the sole source of truth for body parts and exercises.
    WORKOUT_BODY_PART_ROWS=bpRes.data||[];
    WORKOUT_BODY_PARTS=WORKOUT_BODY_PART_ROWS.map(x=>normalizeWorkoutBodyPart(x.name)).filter((x,i,a)=>a.indexOf(x)===i);
    const userPrefs=prefRes.data||[];const prefMap=new Map(userPrefs.map(x=>[x.default_exercise_id,x]));
    WORKOUT_EXERCISE_ROWS=(exRes.data||[]).filter(x=>x.is_default || x.user_id===loadingUserId).flatMap(x=>{if(!x.is_default)return [x];const pref=prefMap.get(x.id);if(pref?.is_hidden)return [];return [{...x,name:pref?.override_name||x.name,equipment:pref?.override_equipment||x.equipment,body_part_id:pref?.override_body_part_id||x.body_part_id,personalDefault:true,sourceDefaultId:x.id}];});
    rebuildExerciseLibrary();
    if (pRes.data) {
      const p=pRes.data;
      Object.assign(store.profile, {
        name:p.name||'', dateOfBirth:p.date_of_birth||'', age:n(p.age,25),
        height:n(p.height,170), currentWeight:n(p.current_weight,70),
        goalWeight:n(p.goal_weight,65), sex:p.sex||'Male',
        activity:p.activity||'Moderately Active', calorieTarget:n(p.calorie_target,2000),
        proteinTarget:n(p.protein_target,125), carbTarget:n(p.carb_target,230),
        fatTarget:n(p.fat_target,80), fiberTarget:n(p.fiber_target,30),
        workoutTarget:n(p.workout_target,300)
      });
      if (store.profile.dateOfBirth) store.profile.age = calculateAge(store.profile.dateOfBirth);
    }

    store.foods = (fRes.data||[]).filter(f => !String(f.name||'').startsWith('__CATALOG__')).map(f => {
      let meta = {};
      try { meta = f.notes ? JSON.parse(f.notes) : {}; } catch(_) {}
      return {
        id:f.id, date:f.date, meal:f.meal||'Breakfast', name:f.name,
        quantity:f.quantity, unit:f.unit, foodId:meta.foodId || null,
        totalGrams:meta.totalGrams == null ? null : n(meta.totalGrams),
        nutritionBasis:meta.nutritionBasis || null, kcal:n(f.calories),
        protein:n(f.protein), carbs:n(f.carbs), fat:n(f.fat), fiber:n(f.fiber)
      };
    });

    store.foodLibrary = (flRes.data||[]).map(f => {
      const oldGramsPerCount = n(f.grams_per_count, 1);
      const basis = f.basis === 'count' ? 'count' : (!f.basis && oldGramsPerCount !== 1 ? 'count' : 'weight');
      return {
        id:f.id, name:f.name, basis,
        caloriesPer100g:n(f.calories_per_100g, n(f.calories_per_g) * 100),
        proteinPer100g:n(f.protein_per_100g, n(f.protein_per_g) * 100),
        carbsPer100g:n(f.carbs_per_100g, n(f.carbs_per_g) * 100),
        fatPer100g:n(f.fat_per_100g, n(f.fat_per_g) * 100),
        fiberPer100g:n(f.fiber_per_100g, n(f.fiber_per_g) * 100),
        caloriesPerCount:basis === 'count' ? n(f.calories_per_count, n(f.calories_per_g) * oldGramsPerCount) : 0,
        proteinPerCount:basis === 'count' ? n(f.protein_per_count, n(f.protein_per_g) * oldGramsPerCount) : 0,
        carbsPerCount:basis === 'count' ? n(f.carbs_per_count, n(f.carbs_per_g) * oldGramsPerCount) : 0,
        fatPerCount:basis === 'count' ? n(f.fat_per_count, n(f.fat_per_g) * oldGramsPerCount) : 0,
        fiberPerCount:basis === 'count' ? n(f.fiber_per_count, n(f.fiber_per_g) * oldGramsPerCount) : 0
      };
    });

    store.workoutSessions=(wsRes.data||[]).map(x=>({id:x.id,date:x.date,minutes:n(x.duration_minutes),kcal:n(x.calories_burned)}));
    const setsByEntry={};(setRes.data||[]).forEach(x=>{(setsByEntry[x.workout_entry_id] ||= []).push({setNumber:x.set_number,weight:n(x.weight_kg),reps:n(x.reps)});});
    store.workouts = (wRes.data||[]).map(w => {
      let legacy={};try{legacy=w.notes?JSON.parse(w.notes):{};}catch(_){}
      return {id:w.id,sessionId:w.session_id||null,exerciseId:w.exercise_id||null,date:w.date,type:w.body_part==='Cardio'?'Cardio':'Strength Training',exercise:w.name||'Workout',bodyPart:normalizeWorkoutBodyPart(w.body_part||legacy.bodyPart||''),equipment:w.equipment||legacy.equipment||'',weight:0,weightUnit:'kg',sets:setsByEntry[w.id]||legacy.sets||[],dumbbellMode:w.dumbbell_mode||legacy.dumbbellMode||'na',cardioIncline:n(w.cardio_incline,legacy.cardioIncline),cardioSpeed:n(w.cardio_speed,legacy.cardioSpeed),custom:!!legacy.custom,minutes:n(w.duration),kcal:n(w.calories_burned)};
    });
    store.weights = (wtRes.data||[]).map(w => ({
      id:w.id, date:w.date, weight:n(w.weight)
    })).sort((a,b)=>new Date(b.date)-new Date(a.date));
    if (store.weights.length) store.profile.currentWeight = n(store.weights[0].weight);

    if (cloudUser?.id !== loadingUserId) throw new Error('Account changed while loading data.');
    renderTabBar();
    renderView();
    showCloudStatus('Cloud sync connected ✓');
  } catch(e) {
    console.warn('Cloud sync failed:', e.message);
    showCloudStatus('Cloud sync failed — please retry');
    throw e;
  } finally {
    cloudSyncing = false;
    hideInitialDataLoading();
  }
}

function showCloudStatus(msg) {
  let el=document.getElementById('cloud-status');
  if(!el){ el=document.createElement('div'); el.id='cloud-status'; el.style.cssText='position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:50%;transform:translateX(-50%);z-index:9999;background:#162337;color:#dfe7f2;padding:7px 12px;border-radius:999px;font:600 11px Plus Jakarta Sans,sans-serif;box-shadow:0 4px 20px rgba(0,0,0,.25);pointer-events:none;'; document.body.appendChild(el); }
  el.textContent=msg; clearTimeout(el._t); el._t=setTimeout(()=>el.remove(),2500);
}

// ── Init ──
// Start the quote request BEFORE any other app initialization. This guarantees
// that a rendering/local-storage error elsewhere cannot prevent the Edge
// Function request from being made.
console.info('[KcalTrack] ===== APP SCRIPT REACHED INIT =====');
console.info('[KcalTrack] Starting daily quote request immediately');
loadDailyQuote(true).catch(e => console.error('[Daily Quote] Startup call crashed:', e));

try {
  store.load();
  console.info('[KcalTrack] store.load() complete');
} catch (e) {
  console.error('[KcalTrack] store.load() failed:', e);
}

try {
  setupPWA();
  renderTabBar();
  renderView();
  console.info('[KcalTrack] UI initialization complete');
} catch (e) {
  console.error('[KcalTrack] UI initialization failed:', e);
}

// Cloud authentication/data sync runs independently of the quote request.
connectCloud().catch(e => console.error('[KcalTrack] connectCloud() crashed:', e));
</script>
